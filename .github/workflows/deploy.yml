name: Deploy to VPS

# Deploys the images Docker Build published for one commit, by that commit's SHA — never :main.
on:
  # A main push deploys once Docker Build has published its images: only a successful run for a
  # push to main, so a failed or partial publish never deploys.
  workflow_run:
    workflows: [Docker Build]
    types: [completed]
    branches: [main]
  # Manual deploy / rollback: `sha` names the commit whose images to deploy.
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to deploy (rollback). Empty = the head of the selected branch.
        required: false
        type: string

jobs:
  deploy:
    name: pull + deploy by commit SHA
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    # One production stack: deploys queue, never overlap. On the job, so a skipped run never
    # takes the group's pending slot from a real deploy.
    concurrency:
      group: deploy
      cancel-in-progress: false
    runs-on: [self-hosted, lifekit-vps, finance-sentry]
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      # workflow_run: the commit Docker Build published. Dispatch: the `sha` input, else the
      # dispatched ref's head. Exported as IMAGE_TAG, which the prod compose file tags images with.
      - name: Resolve the commit to deploy
        id: target
        env:
          INPUT_SHA: ${{ inputs.sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REF_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="${INPUT_SHA:-${RUN_SHA:-$REF_SHA}}"
          sha="$(tr -d '[:space:]' <<< "$sha" | tr 'A-F' 'a-f')"
          if ! [[ $sha =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the commit to deploy must be a full 40-character SHA"
            exit 1
          fi
          # A newer main commit supersedes a build-triggered deploy, so a slower older build
          # finishing late never rolls prod back. Manual deploys and rollbacks skip this check.
          if [[ $EVENT_NAME == workflow_run ]]; then
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            refs="$(git -c "http.extraHeader=Authorization: Basic $auth" \
              ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main)"
            head="$(cut -f1 <<< "$refs")"
            if ! [[ $head =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::could not read the head of main (got '$head')"
              exit 1
            fi
            if [[ $head != "$sha" ]]; then
              echo "$sha is no longer the head of main ($head); skipping its deploy"
              echo "stale=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$sha" >> "$GITHUB_ENV"
          echo "deploying $sha"

      # The workflow's own ref (never the `sha` input): compose file, deploy script and smoke
      # tests come from the trusted ref, and `sha` only selects which images run. A rollback
      # redeploys older images under the current config.
      - name: Checkout
        if: steps.target.outputs.stale != 'true'
        uses: actions/checkout@v7

      - name: Log in to ghcr
        if: steps.target.outputs.stale != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A commit from before deploy-by-SHA has a compose file that builds its images instead, so
      # it cannot be deployed this way.
      - name: Deploy
        if: steps.target.outputs.stale != 'true'
        run: |
          if ! grep -q 'IMAGE_TAG' docker/docker-compose.prod.yml; then
            echo "::error::$IMAGE_TAG predates deploying by commit SHA; pick a later commit"
            exit 1
          fi
          ./docker/deploy.sh

      # Read-only Playwright smoke against the stack just deployed (real login, no
      # mocks). Runs in the Playwright image on the host network so it can reach the
      # loopback-bound gateway; the e2e sources are copied out of the read-only mount
      # so npm never writes into the runner workspace.
      - name: Live e2e smoke (deployed stack)
        if: steps.target.outputs.stale != 'true'
        run: |
          docker run --rm --network host \
            -v "$PWD/frontend:/repo:ro" -w /work \
            mcr.microsoft.com/playwright:v1.62.1-noble \
            bash -c "cp -r /repo/e2e /repo/playwright.live.config.ts . \
              && npm i --no-save --no-audit --no-fund @playwright/test@1.62.1 \
              && npx playwright test --config playwright.live.config.ts"

      - name: Logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.prod.yml ps
          docker compose -f docker/docker-compose.prod.yml logs --tail 100
