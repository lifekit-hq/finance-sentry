name: Frontend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'docker/nginx.security-headers.conf'
      - 'docker/nginx.frontend.conf'
      - 'docker/Dockerfile.frontend.prod'
      - '.github/workflows/frontend-ci.yml'
  # No `paths:` filter on PRs: the required check must always report. Path filtering
  # happens inside the workflow instead (changes job + aggregate job below).
  pull_request:
    branches: [ main ]
  # Dispatched by weekly-release.yml against the release-please branch (see backend-ci.yml).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Always runs so the required check below always reports; classifies the PR diff so
  # the heavy job only runs when its area changed (see .github/scripts/changed-areas.sh).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      frontend: ${{ steps.areas.outputs.frontend }}
      docker: ${{ steps.areas.outputs.docker }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 2

    - name: Classify changed files
      id: areas
      run: .github/scripts/changed-areas.sh frontend-ci.yml

  frontend-checks:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install dependencies
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npm ci
      working-directory: frontend

    - name: Lint code
      run: npm run lint
      working-directory: frontend

    - name: Format check
      run: npm run format:check
      working-directory: frontend

    # Source scan for what bypasses the @lifekit-hq/tokens contract (font, colour, text size, radius,
    # root font size, layout transitions); fails on any finding.
    - name: Design drift check
      run: npm run drift
      working-directory: frontend

    - name: Build application
      run: npm run build
      working-directory: frontend

    # Built index.html theme-color pair and manifest fields against the lifekit browser-chrome standard.
    - name: Browser chrome check
      run: npm run chrome-check
      working-directory: frontend

    # Vitest runs specs in a real Chromium via @vitest/browser-playwright.
    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium
      working-directory: frontend

    # Coverage thresholds live in angular.json (test → configurations → ci) as ratchet
    # floors set just under measured coverage — raise them as coverage grows.
    # Constitution §II's ≥80% target is not yet met by the app project (41% today).
    # Fail-fast backstop: the browser-mode runner can deadlock or get OOM-killed
    # (exit 137); a healthy run finishes in well under a minute.
    - name: Run unit tests with coverage gate
      timeout-minutes: 10
      run: npm run test:ci
      working-directory: frontend

    - name: Run Playwright e2e tests
      # mkdir first: the redirect target's directory is gitignored, so it does
      # not exist in a fresh checkout and the redirect fails before Playwright
      # even starts.
      env:
        PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results.json
      run: |
        mkdir -p playwright-report
        npx playwright test --reporter=list,json
      working-directory: frontend

    # Builds the production image (precompressed assets, the shipped nginx config) and loads
    # /login cold at 390px on Slow 4G with a 4x CPU slowdown. The median is reported against the
    # 2.5 s Core Web Vitals "good" mark; the step fails only past the regression budget declared
    # in frontend/scripts/measure-lcp.mjs. `--add-host api:...` lets nginx resolve its /api
    # upstream - the login page renders without a backend.
    - name: Build production frontend image
      env:
        NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        docker build -f docker/Dockerfile.frontend.prod \
          --secret id=npm_token,env=NPM_TOKEN -t finance-sentry-frontend:lcp .

    - name: Measure cold /login LCP
      run: |
        docker run -d --name frontend-lcp --add-host api:127.0.0.1 -p 4290:4200 finance-sentry-frontend:lcp
        trap 'status=$?; [ "$status" -eq 0 ] || docker logs frontend-lcp; docker rm -f frontend-lcp' EXIT
        timeout 30 sh -c 'until curl -sf http://localhost:4290/readyz; do sleep 1; done'
        node scripts/measure-lcp.mjs http://localhost:4290
      working-directory: frontend

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: |
          frontend/playwright-report/
          frontend/test-results/

    # - name: Upload coverage
    #   if: always()
    #   uses: codecov/codecov-action@v3
    #   with:
    #     files: './frontend/coverage/lcov.info'
    #     flags: frontend
    #     verbose: true

    # - name: Upload coverage artifact
    #   if: always()
    #   uses: actions/upload-artifact@v7
    #   with:
    #     name: coverage-report-frontend
    #     path: frontend/coverage/

  # The screen gates (screen check, route scan, pixel baselines) over every routed screen, in
  # report-only mode per route (frontend/e2e/screens/routes.ts): findings are printed and
  # annotated, and a route starts failing on them when it moves to `enforce`. Its own job so the
  # ~15 minutes it takes stay off the critical path of the e2e above.
  frontend-screens:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install dependencies
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npm ci
      working-directory: frontend

    - name: Build application
      run: npm run build
      working-directory: frontend

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium
      working-directory: frontend

    # The design judge is a release binary the route scan downloads once and verifies against a pinned sha256.
    - name: Cache the design judge
      uses: actions/cache@v6
      with:
        path: ~/.impeccable
        key: impeccable-${{ hashFiles('frontend/package-lock.json') }}

    - name: Screen check and baselines
      run: npm run test:screens
      working-directory: frontend

    - name: Route scan
      run: npm run test:routes
      working-directory: frontend

    - name: Upload the screen reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: screen-gates
        path: |
          frontend/playwright-report/screens.json
          frontend/e2e/screens/.output
        include-hidden-files: true
        if-no-files-found: ignore

  # A pull request that changes a screen baseline gets the screen before (base) and after (this
  # branch) attached as one comment, edited in place on every push and removed when the baselines no
  # longer differ. Same-repository branches only: a fork's token cannot comment.
  baseline-report:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
    - uses: actions/setup-node@v7
      with:
        node-version: '22.x'
    - uses: lifekit-hq/lifekit-common/.github/actions/baseline-report@v4.7.0
      with:
        token: ${{ github.token }}
        repo: ${{ github.repository }}
        pr: ${{ github.event.pull_request.number }}
        base: ${{ github.event.pull_request.base.sha }}
        head: ${{ github.event.pull_request.head.sha }}

  # Required status check (branch protection) — keep this job name. Passes when the
  # heavy job succeeded or was skipped by the path filter; fails if anything failed or
  # was cancelled, including the changes job itself.
  lint-build-test:
    needs: [changes, frontend-checks, frontend-screens]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Require the frontend checks to have passed or been skipped
      env:
        RESULTS: ${{ needs.changes.result }} ${{ needs.frontend-checks.result }} ${{ needs.frontend-screens.result }}
      run: |
        echo "needs results: $RESULTS"
        case " $RESULTS " in
          *" failure "*|*" cancelled "*) exit 1 ;;
        esac
