name: Frontend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  # No paths filter on PRs — lint-build-test is a required status check on main
  # (see backend-ci.yml for the rationale).
  pull_request:
    branches: [ main ]
  # Dispatched by weekly-release.yml against the release-please branch (see backend-ci.yml).
  workflow_dispatch:

jobs:
  lint-build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install dependencies
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npm ci
      working-directory: frontend

    - name: Lint code
      run: npm run lint
      working-directory: frontend

    - name: Format check
      run: npm run format:check
      working-directory: frontend

    - name: Build application
      run: npm run build
      working-directory: frontend

    # Vitest runs specs in a real Chromium via @vitest/browser-playwright.
    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium
      working-directory: frontend

    # Coverage thresholds live in angular.json (test → configurations → ci) as ratchet
    # floors set just under measured coverage — raise them as coverage grows.
    # Constitution §II's ≥80% target is not yet met by the app project (41% today).
    - name: Run unit tests with coverage gate
      run: npm run test:ci
      working-directory: frontend

    - name: Run Playwright e2e tests
      # mkdir first: the redirect target's directory is gitignored, so it does
      # not exist in a fresh checkout and the redirect fails before Playwright
      # even starts.
      run: |
        mkdir -p playwright-report
        npx playwright test --reporter=json > playwright-report/results.json
      working-directory: frontend

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: frontend/playwright-report/

