name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: # manual regenerate — used to rehearse the release PR path

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN pushes fire no workflows, so a release PR pushed with it never gets
      # the required checks and can never merge (#623). The release bot app (Contents +
      # Pull requests write, installed on this repo only) mints a one-hour token per run;
      # its pushes trigger the pull_request CI runs like any other contributor's.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
