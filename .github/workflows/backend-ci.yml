name: Backend CI

on:
  push:
    branches: [ main, 001-bank-account-sync ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  # No paths filter on PRs: build-and-test is a required status check on main, and a
  # path-filtered workflow that skips never reports, which would block the merge.
  # Running on every PR also guarantees CI covered the exact head commit being merged.
  pull_request:
    branches: [ main ]
  # Dispatched by weekly-release.yml against the release-please branch: its pushes use
  # GITHUB_TOKEN, which fires no workflows, so the required checks must be run explicitly.
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: finance_sentry
          POSTGRES_USER: finance_user
          POSTGRES_PASSWORD: finance_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore backend/FinanceSentry.sln

    - name: Build solution
      run: dotnet build backend/FinanceSentry.sln --configuration Release --no-restore

    # 509: run the FULL solution — the old two-project shape silently skipped the 9
    # module test suites (~550 tests never ran in CI).
    - name: Run all tests with coverage
      env:
        ConnectionStrings__Default: "Host=localhost;Port=5432;Database=finance_sentry;Username=finance_user;Password=finance_password"
      run: |
        dotnet test backend/FinanceSentry.sln \
          --configuration Release --no-build --verbosity normal \
          --collect:"XPlat Code Coverage;Format=opencover" \
          --results-directory TestResults \
          --logger "trx"

    # Coverage ratchet (509): floor sits just under measured coverage (26.8% line on
    # 2026-08-30) and only moves UP as coverage grows — raise it with every feature
    # that lifts the number. Constitution §II's 80% stays the destination.
    - name: Enforce coverage ratchet floor
      run: |
        dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.* 2>/dev/null || true
        ~/.dotnet/tools/reportgenerator \
          -reports:"TestResults/**/coverage.opencover.xml" \
          -targetdir:"TestResults/CoverageReport" \
          -reporttypes:"TextSummary;Cobertura" \
          -assemblyfilters:"+FinanceSentry.*"
        COVERAGE=$(grep -oP 'Line coverage: \K[\d.]+' TestResults/CoverageReport/Summary.txt || echo "0")
        FLOOR=25
        echo "Line coverage: ${COVERAGE}% (ratchet floor: ${FLOOR}%)"
        awk -v cov="$COVERAGE" -v floor="$FLOOR" 'BEGIN {
          if (cov+0 < floor) {
            print "FAIL: Coverage " cov "% fell below the " floor "% ratchet floor";
            exit 1
          } else {
            print "PASS: Coverage " cov "% holds the " floor "% ratchet floor"
          }
        }'

    - name: Generate test report
      if: always()
      uses: dorny/test-reporter@v3
      with:
        name: .NET Test Results
        path: '**/TestResults/**/*.trx'
        reporter: 'dotnet-trx'

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-backend
        path: TestResults/CoverageReport/
