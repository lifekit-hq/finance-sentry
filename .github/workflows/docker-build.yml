name: Docker Build

on:
  # Every push to main builds and publishes all four images: they are deployed by commit SHA,
  # so each main commit needs its own set regardless of which files it touched.
  push:
    branches: [ main ]
  # No `paths:` filter on PRs: the required check must always report. Path filtering
  # happens inside the workflow instead (changes job + aggregate job below).
  pull_request:
    branches: [ main ]
  # Dispatched by weekly-release.yml against the release-please branch (see backend-ci.yml).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Always runs so the required check below always reports; classifies the PR diff so
  # the image jobs only run for the images whose inputs changed (see
  # .github/scripts/changed-areas.sh). Outputs the matrix of images to build.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 2

    - name: Classify changed files
      id: areas
      run: .github/scripts/changed-areas.sh docker-build.yml

    # The prod secrets file must be encrypted to exactly the recipients .sops.yaml names.
    - name: Check sops recipients
      run: .github/scripts/check-sops-recipients.sh

    - name: Select images to build
      id: matrix
      env:
        DOTNET: ${{ steps.areas.outputs.docker }}
        FRONTEND: ${{ steps.areas.outputs.docker_frontend }}
      run: |
        images='[]'
        add() { images=$(jq -c --arg s "$1" --arg f "$2" '. + [{service: $s, dockerfile: $f}]' <<< "$images"); }
        if [ "$DOTNET" = true ]; then
          add api docker/Dockerfile
          add mcp docker/Dockerfile.mcp
          add gateway docker/Dockerfile.gateway
        fi
        if [ "$FRONTEND" = true ]; then
          add frontend docker/Dockerfile.frontend.prod
        fi
        echo "images=$images" >> "$GITHUB_OUTPUT"
        echo "images: $images"

  # PRs (and dispatches): build and scan each image, never push. Read-only token, so a PR
  # build cannot publish even by mistake; the layer cache is read from ghcr but not written.
  image:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.images != '[]'
    name: image (${{ matrix.service }})
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Build and scan
      uses: ./.github/actions/build-image
      with:
        service: ${{ matrix.service }}
        dockerfile: ${{ matrix.dockerfile }}
        token: ${{ secrets.GITHUB_TOKEN }}

  # Pushes to main: build, scan, then publish ghcr.io/lifekit-hq/finance-sentry-<service>
  # as :<sha> and :main, and refresh the :buildcache layer cache. The only job with write access.
  publish:
    needs: changes
    if: github.event_name == 'push'
    name: publish (${{ matrix.service }})
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Build, scan and push
      uses: ./.github/actions/build-image
      with:
        service: ${{ matrix.service }}
        dockerfile: ${{ matrix.dockerfile }}
        token: ${{ secrets.GITHUB_TOKEN }}
        push: 'true'

  # Required status check (branch protection) — keep this job name. Passes when the
  # image jobs succeeded or were skipped by the path filter; fails if anything failed or
  # was cancelled, including the changes job itself.
  build-backend-image:
    needs: [changes, image, publish]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Require the image builds to have passed or been skipped
      env:
        RESULTS: ${{ needs.changes.result }} ${{ needs.image.result }} ${{ needs.publish.result }}
      run: |
        echo "needs results: $RESULTS"
        case " $RESULTS " in
          *" failure "*|*" cancelled "*) exit 1 ;;
        esac
