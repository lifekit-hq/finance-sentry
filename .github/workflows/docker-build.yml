name: Docker Build

on:
  push:
    branches: [ main, 001-bank-account-sync ]
    paths:
      - 'backend/**'
      - 'docker/Dockerfile'
      - '.github/workflows/docker-build.yml'
  # No paths filter on PRs — build-backend-image is a required status check on main
  # (see backend-ci.yml for the rationale).
  pull_request:
    branches: [ main ]
  # Dispatched by weekly-release.yml against the release-please branch (see backend-ci.yml).
  workflow_dispatch:

jobs:
  build-backend-image:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./
        file: ./docker/Dockerfile
        push: false
        tags: finance-sentry-api:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        outputs: type=docker,dest=/tmp/image.tar

    - name: Load image for testing
      run: |
        docker load --input /tmp/image.tar
        docker images

    # 510: gate on known fixable HIGH/CRITICAL vulnerabilities in the built image
    # (OS packages + .NET deps). --ignore-unfixed keeps base-image CVEs without an
    # available patch from blocking every PR.
    - name: Scan image for vulnerabilities (Trivy)
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: finance-sentry-api:latest
        format: table
        exit-code: '1'
        severity: CRITICAL,HIGH
        ignore-unfixed: true

    - name: Test health endpoint
      run: |
        docker run -d --name finance-sentry-test -p 8080:8080 finance-sentry-api:latest
        sleep 5
        curl -f http://localhost:8080/api/v1/health || exit 1
        docker stop finance-sentry-test
      continue-on-error: true
