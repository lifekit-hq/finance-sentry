name: Weekly Release

# Cuts a release once a week by merging the Release Please PR that accumulates on main.
# Release Please keeps that PR current on every merge; this job just lands it on a cadence.
# No releasable commits since the last release → no PR → the job no-ops.
#
# The merge uses the release bot app token (same app release-please pushes with), so it
# is a real push to main: Release Please tags + publishes the GitHub release and the VPS
# deploy ships the bumped version through their normal push triggers.

on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC
  workflow_dispatch: # manual "release now"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Merge pending release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --state open --label "autorelease: pending" --json number --jq '.[0].number // empty')
          if [[ -z "$pr" ]]; then
            echo "No pending release PR — nothing to release this week."
            exit 0
          fi

          # The release branch gets its checks from pull_request runs on every regeneration.
          # Wait for any still in flight; a failed check aborts before the merge.
          gh pr checks "$pr" --watch --fail-fast

          echo "Merging release PR #$pr"
          gh pr merge "$pr" --squash --delete-branch
