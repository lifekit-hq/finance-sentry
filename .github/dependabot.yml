# Automated dependency updates (issue #510). Weekly, grouped minor+patch to keep
# PR noise low; security updates open immediately regardless of schedule.
# Families that must move together are grouped across all update types (majors
# too), so a family bump is one PR and one deploy: npm devDependencies, and the
# Serilog* NuGet family (sibling PRs #648-#650 conflicted). NuGet labels every
# package direct:production, so it has no dev/production split to group on.
version: 2
registries:
  github-npm:
    # @lifekit-hq/* resolves from GitHub Packages; Dependabot needs its own token
    # (Dependabot secrets, read:packages) — set DEPENDABOT_GH_PACKAGES_TOKEN in
    # repo Settings → Secrets → Dependabot, else npm updates fail to resolve.
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.DEPENDABOT_GH_PACKAGES_TOKEN }}

updates:
  - package-ecosystem: npm
    directory: /frontend
    registries:
      - github-npm
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      npm-dev-dependencies:
        dependency-type: "development"
      npm-minor-and-patch:
        dependency-type: "production"
        update-types:
          - minor
          - patch

  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      nuget-serilog-family:
        patterns:
          - "Serilog*"
      nuget-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
