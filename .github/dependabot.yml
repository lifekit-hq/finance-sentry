# Automated dependency updates (issue #510). Weekly, grouped minor+patch to keep
# PR noise low; security updates open immediately regardless of schedule.
# Families that must move together are grouped across all update types (majors
# too), so a family bump is one PR and one deploy: the Angular npm family
# (@angular/*, @angular-devkit/*, zone.js, across production and development;
# split bumps fail peer resolution, #1198), npm devDependencies, and the
# Serilog* NuGet family (sibling PRs #648-#650 conflicted). Dependabot applies the
# first matching group, so the Angular family is listed first. NuGet labels every
# package direct:production, so it has no dev/production split to group on.
version: 2
registries:
  github-npm:
    # @lifekit-hq/* resolves from GitHub Packages; Dependabot needs its own token
    # (Dependabot secrets, read:packages) — set DEPENDABOT_GH_PACKAGES_TOKEN in
    # repo Settings → Secrets → Dependabot, else npm updates fail to resolve.
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.DEPENDABOT_GH_PACKAGES_TOKEN }}

updates:
  - package-ecosystem: npm
    directory: /frontend
    registries:
      - github-npm
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    # Majors that cannot land yet; each holds the whole npm-dev-dependencies
    # group red (#1247, PR #1310), so drop an entry once its blocker clears:
    #  - typescript 7: @angular-devkit/build-angular peers typescript >=6.0 <6.1
    #    (npm ci fails ERESOLVE).
    #  - eslint 10: eslint-plugin-import (via @lifekit-hq/config) peers eslint <=9.
    #  - tailwindcss 4: needs the v3 -> v4 migration (tailwind.config.js presets
    #    @lifekit-hq/tokens' v3 preset; styles.scss uses the v3 directives).
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
    groups:
      npm-angular-family:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "zone.js"
      npm-dev-dependencies:
        dependency-type: "development"
      npm-minor-and-patch:
        dependency-type: "production"
        update-types:
          - minor
          - patch

  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    # FluentAssertions 8+ is commercially licensed (Xceed); stay on the Apache-2.0 7.x line.
    ignore:
      - dependency-name: "FluentAssertions"
        versions: [">=8.0.0"]
    groups:
      nuget-serilog-family:
        patterns:
          - "Serilog*"
      nuget-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
