# Per-repo no-mistakes overrides (honored from the default-branch copy).
#
# Pin the gate's Lint and Test steps to the commands CI already runs, so
# validation is declared here instead of decided per run by the test agent.
# Sources of truth (keep in step; the workflows win on divergence):
#   .github/workflows/frontend-ci.yml  job `lint-build-test`
#   .github/workflows/backend-ci.yml   job `build-and-test`
#
# Lint = the frontend workflow's "Lint code" + "Format check" steps. The
# backend has no separate lint step: C# style is enforced at build time via
# EnforceCodeStyleInBuild (backend/Directory.Build.props), so it lives under
# `test` with the build. Both npm-based commands self-provision `node_modules`
# with `npm ci` the way CI does; `@lifekit-hq/*` resolves from GitHub Packages,
# so NODE_AUTH_TOKEN (a token with read:packages) must be in the environment
# (CI passes secrets.GITHUB_TOKEN). `.NET 10 SDK` and Docker (Testcontainers
# for the integration suites) are host prerequisites.
#
# The dotnet steps (one shell string so restore state survives) run: directly when `dotnet`
# is on the PATH (a CI-like runner), otherwise inside the
# mcr.microsoft.com/dotnet/sdk:10.0 image with the repo mounted, host networking
# and the Docker socket passed through so the Testcontainers suites still run
# (they skip on their own when no daemon is reachable). The container is
# capped with --memory 2g; --memory-swap is left unset so Docker's default
# applies (swap equal to the memory limit), meaning a runaway run slows down
# on swap instead of getting the host's other processes OOM-killed. Memory
# is kept in check by: build without the resident Roslyn server
# (-p:UseSharedCompilation=false + `dotnet build-server shutdown`), test
# hosts limited to two (-m:2; unset it starts one per logical CPU), and
# workstation GC (DOTNET_gcServer=0).
# Testcontainers-started containers are not covered by that cap.
#
# Not declared: the backend coverage ratchet step (a reportgenerator summary
# gate over the test run, not a test; it stays a CI-only check) and the
# CI-only ConnectionStrings__Default env (every integration test injects its
# own Testcontainers Postgres connection string, so nothing reads it).
commands:
  lint: >-
    cd frontend
    && npm ci
    && npm run lint
    && npm run format:check
  test: >-
    dn='dotnet restore backend/FinanceSentry.sln
    && dotnet build backend/FinanceSentry.sln --configuration Release --no-restore -m:1
    -p:UseSharedCompilation=false
    && dotnet build-server shutdown
    && dotnet test backend/FinanceSentry.sln --configuration Release --no-build -m:2 --verbosity normal'
    && if command -v dotnet >/dev/null 2>&1; then sh -c "$dn"; else
    docker run --rm --memory 2g --network host -u "$(id -u):$(id -g)"
    --group-add "$(stat -c %g /var/run/docker.sock)"
    -e HOME=/tmp -e DOTNET_CLI_HOME=/tmp -e DOTNET_NOLOGO=1
    -e DOTNET_gcServer=0
    -v /var/run/docker.sock:/var/run/docker.sock
    -v "$PWD":/src -w /src mcr.microsoft.com/dotnet/sdk:10.0 sh -c "$dn"; fi
    && cd frontend
    && npm ci
    && npm run build
    && npx playwright install --with-deps chromium
    && npm run test:ci
    && mkdir -p playwright-report
    && npx playwright test --reporter=json > playwright-report/results.json
