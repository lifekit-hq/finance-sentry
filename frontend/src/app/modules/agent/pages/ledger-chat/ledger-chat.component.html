<div class="relative flex h-full gap-cmn-4">
  <!-- Conversation sidebar -->
  <aside
    [class.flex]="store.sessionsOpen()"
    class="absolute inset-y-0 left-0 z-10 hidden w-64 shrink-0 flex-col shadow-lg md:static md:z-auto md:flex md:shadow-none gap-cmn-3 rounded-cmn-lg border border-border-default bg-surface-card p-cmn-3"
  >
    <cmn-button [icon]="newChatIcon" (clicked)="onNewChat()" variant="secondary">
      New chat
    </cmn-button>

    <div class="flex-1 overflow-y-auto">
      @if (store.hasConversations()) {
        <ul class="flex flex-col gap-cmn-1">
          @for (conversation of store.conversations(); track conversation.id) {
            <li
              [class.bg-surface-hover]="conversation.id === store.activeConversationId()"
              class="flex items-center justify-between gap-cmn-1 rounded-cmn-md pr-cmn-1 hover:bg-surface-hover"
            >
              <button
                (click)="onSelect(conversation)"
                type="button"
                class="min-w-0 flex-1 truncate px-cmn-2 py-cmn-2 text-left text-cmn-sm text-text-secondary"
              >
                {{ conversation.title || 'Untitled' }}
              </button>
              <cmn-button
                [icon]="deleteIcon"
                (clicked)="onDelete(conversation, $event)"
                variant="destructive"
                size="sm"
                aria-label="Delete conversation"
              />
            </li>
          }
        </ul>
      } @else {
        <p class="px-cmn-2 py-cmn-4 text-cmn-sm text-text-disabled">No conversations yet.</p>
      }
    </div>
  </aside>

  <!-- Chat surface -->
  <section
    class="flex min-w-0 flex-1 flex-col overflow-hidden rounded-cmn-lg border border-border-default bg-surface-card"
  >
    <div class="flex items-center border-b border-border-default p-cmn-2 md:hidden">
      <cmn-button
        [icon]="sessionsIcon"
        (clicked)="store.setSessionsOpen(!store.sessionsOpen())"
        variant="secondary"
        size="sm"
      >
        Sessions
      </cmn-button>
    </div>
    @for (key of [store.historyKey()]; track key) {
      <cmn-chat
        [history]="store.history()"
        [stream]="chatStream"
        placeholder="Ask Ledger…"
        introMessage="I'm Ledger — your finance agent, grounded in your real book. Ask about allocation drift, risk, the regime, or a position."
      />
    }
  </section>
</div>
