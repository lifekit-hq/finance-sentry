<div class="relative flex h-full gap-cmn-4">
  <!-- Conversation sidebar (phone: a CmnDrawerService sheet behind the Sessions button) -->
  <aside
    aria-label="Conversations"
    class="hidden w-64 shrink-0 rounded-cmn-lg border border-border-default bg-surface-card p-cmn-3 md:block"
  >
    <fns-sessions-list [pageStore]="store" />
  </aside>

  <!-- Chat surface -->
  <section
    class="flex min-w-0 flex-1 flex-col overflow-hidden rounded-cmn-lg border border-border-default bg-surface-card"
  >
    <div class="flex items-center border-b border-border-default p-cmn-2 md:hidden">
      <cmn-button [icon]="sessionsIcon" (clicked)="openSessions()" variant="secondary" size="sm">
        Sessions
      </cmn-button>
    </div>
    @for (key of [store.historyKey()]; track key) {
      <cmn-chat
        [history]="store.history()"
        [stream]="chatStream"
        placeholder="Ask Ledger…"
        introMessage="I'm Ledger — your finance agent, grounded in your real book. Ask about allocation drift, risk, the regime, or a position."
      />
    }
  </section>
</div>
