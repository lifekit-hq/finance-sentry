<cmn-button [icon]="newChatIcon" (clicked)="onNewChat()" variant="secondary">New chat</cmn-button>

<div class="flex-1 overflow-y-auto">
  @if (store.hasConversations()) {
    <ul class="flex flex-col gap-cmn-1">
      @for (conversation of store.conversations(); track conversation.id) {
        <li
          [class.bg-surface-hover]="conversation.id === store.activeConversationId()"
          class="flex items-center justify-between gap-cmn-1 rounded-cmn-md pr-cmn-1 hover:bg-surface-hover"
        >
          <cmn-list-item-row
            [label]="conversation.title || 'Untitled'"
            [action]="true"
            (activated)="onSelect(conversation)"
            class="min-w-0 flex-1"
          />
          <cmn-menu
            [items]="conversationMenuItems"
            (itemSelect)="onConversationAction($event.id, conversation)"
            ariaLabel="Conversation actions"
            triggerClass="h-8 w-8 text-text-secondary hover:bg-surface-raised"
          >
            <cmn-icon name="Ellipsis" size="sm" />
          </cmn-menu>
        </li>
      }
    </ul>
  } @else {
    <p class="px-cmn-2 py-cmn-4 text-cmn-sm text-text-disabled">No conversations yet.</p>
  }
</div>
