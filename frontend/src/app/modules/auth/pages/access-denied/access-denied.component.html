<cmn-page kind="detail" title="You don't have access yet">
  <p class="text-cmn-sm text-text-secondary" data-testid="access-denied-message">
    You signed in, but this account has no access to Finance Sentry. Ask the owner for access.
  </p>
  <p class="mt-cmn-2 mb-cmn-6 text-cmn-sm text-text-secondary">
    Once the owner has given you access, sign in again.
  </p>
  <cmn-button (click)="onTryAgain()" type="button" variant="primary">Try again</cmn-button>
</cmn-page>
