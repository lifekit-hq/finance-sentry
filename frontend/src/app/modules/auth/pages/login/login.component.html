<div class="flex items-center justify-center min-h-full bg-surface-bg px-cmn-4">
  <div
    class="bg-surface-card p-cmn-8 rounded-cmn-md border border-border-default w-full max-w-[440px]"
  >
    <div class="mb-cmn-8">
      <h1 class="font-headline text-cmn-2xl font-bold text-text-primary mb-cmn-1">Welcome back</h1>
      <p class="text-cmn-sm text-text-secondary">Sign in to Finance Sentry</p>
    </div>

    @if (flashMessage(); as flash) {
      <cmn-alert [variant]="flash.kind" class="block mb-cmn-4">{{ flash.text }}</cmn-alert>
    }

    @if (errorMessage()) {
      <cmn-alert variant="error" class="block mb-cmn-4">{{ errorMessage() }}</cmn-alert>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <cmn-form-field
        [control]="form.get('email')"
        label="Email address"
        formControlName="email"
        class="block mb-cmn-5"
      >
        <cmn-input type="email" placeholder="name@organization.com" />
      </cmn-form-field>

      <div class="mb-cmn-6">
        <cmn-form-field
          [control]="form.get('password')"
          label="Password"
          formControlName="password"
        >
          <cmn-input type="password" placeholder="••••••••" />
        </cmn-form-field>
      </div>

      <cmn-button
        [disabled]="loading() || form.invalid"
        [loading]="loading()"
        type="submit"
        variant="primary"
        class="block w-full mb-cmn-6"
        >{{ loading() ? 'Signing in…' : 'Sign in' }}</cmn-button
      >
    </form>

    <div class="flex items-center gap-cmn-3 mb-cmn-6">
      <div class="flex-1 h-px bg-border-default"></div>
      <span class="text-cmn-xs text-text-secondary uppercase tracking-wide">or</span>
      <div class="flex-1 h-px bg-border-default"></div>
    </div>

    <div #googleContainer class="flex justify-center mb-cmn-6">
      @if (googleButtonConfig(); as config) {
        <cmn-google-sign-in-button
          [clientId]="googleClientId"
          [locale]="googleLocale"
          [buttonConfiguration]="config"
          (credential)="onGoogleCredential($event)"
        />
      }
    </div>

    <p class="text-center text-cmn-sm text-text-secondary">
      New here? Ask the account owner for an invite link.
    </p>
  </div>
</div>
