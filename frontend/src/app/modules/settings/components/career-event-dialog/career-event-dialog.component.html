<form [formGroup]="form" (ngSubmit)="submit()" class="space-y-cmn-3">
  <div>
    <label
      for="career-event-kind"
      class="mb-cmn-1 block font-label text-cmn-xs font-semibold uppercase tracking-widest text-text-secondary"
    >
      What happens
    </label>
    <cmn-select [options]="kindOptions" formControlName="kind" id="career-event-kind" />
  </div>
  <cmn-form-field
    [control]="form.controls.label"
    label="Name"
    hint="What you call it, e.g. Promotion. Stored encrypted."
  >
    <cmn-input
      formControlName="label"
      autocomplete="off"
      enterkeyhint="next"
      placeholder="Promotion"
    />
  </cmn-form-field>
  <cmn-form-field [control]="form.controls.amount" [hint]="amountHint()" label="Amount">
    <cmn-input
      formControlName="amount"
      type="number"
      inputmode="decimal"
      enterkeyhint="next"
      placeholder="0.00"
    />
  </cmn-form-field>
  <div>
    <label
      for="career-event-currency"
      class="mb-cmn-1 block font-label text-cmn-xs font-semibold uppercase tracking-widest text-text-secondary"
    >
      Currency
    </label>
    <cmn-select [options]="currencyOptions" formControlName="currency" id="career-event-currency" />
  </div>
  <cmn-form-field
    [control]="form.controls.when"
    [hint]="
      isLeave()
        ? 'First and last day of the leave.'
        : 'The date it happens. The second date is only for a leave.'
    "
    label="When"
  >
    <cmn-date-range
      [toLabel]="isLeave() ? 'Last day' : 'Last day (leave only)'"
      formControlName="when"
      groupLabel="When"
      fromLabel="Date"
    />
  </cmn-form-field>
  <cmn-form-field
    [control]="form.controls.note"
    label="Note (optional)"
    hint="Anything you want to remember about it. Stored encrypted."
  >
    <cmn-textarea [rows]="noteRows" formControlName="note" />
  </cmn-form-field>
  <cmn-dialog-actions align="end">
    <cmn-button (clicked)="cancel()" variant="secondary">Cancel</cmn-button>
    <cmn-button type="submit" variant="primary">{{ isEdit ? 'Save' : 'Add' }}</cmn-button>
  </cmn-dialog-actions>
</form>
