<cmn-page-container spacing="none" fill>
  <div class="flex items-center justify-between gap-cmn-3">
    <p class="min-w-0 text-cmn-sm text-text-secondary">{{ alertsSubtitle() }}</p>
    <cmn-badge [count]="activeFilterCount()" status="default" class="shrink-0">
      <cmn-button
        (clicked)="openFilters()"
        variant="secondary"
        icon="SlidersHorizontal"
        data-testid="alerts-filter-button"
      >
        <span class="sr-only">Filters</span>
      </cmn-button>
    </cmn-badge>
  </div>

  @if (store.filter() !== 'all') {
    <div
      class="mt-cmn-3 flex flex-wrap items-center gap-x-cmn-2 gap-y-3"
      data-testid="alerts-applied-filters"
    >
      <lk-dismissible-chip
        [attr.label]="filterLabel()"
        (lk-dismissible-chip-remove)="clearFilter()"
        data-testid="alerts-chip-filter"
      />
      <cmn-button
        (clicked)="clearFilter()"
        variant="secondary"
        size="sm"
        data-testid="alerts-filter-clear"
      >
        Clear
      </cmn-button>
    </div>
  }

  <cmn-async-state
    [status]="view().status"
    [errorMessage]="view().errorMessage"
    [isEmpty]="store.alerts().length === 0"
    (retry)="store.load(store.query())"
    class="mt-cmn-3 flex min-h-0 flex-1 flex-col"
    retryable
  >
    <div skeleton class="space-y-cmn-2" data-testid="alerts-skeleton">
      @for (row of skeletonRows; track row) {
        <cmn-skeleton height="4rem" />
      }
    </div>
    <div empty class="flex min-h-0 flex-1 items-center justify-center">
      <cmn-empty-state
        [message]="emptyTitle()"
        [subMessage]="emptySubtext()"
        icon="CheckCircle2"
        iconClass="text-status-success"
      />
    </div>
    <div class="md:min-h-0 md:flex-1 md:overflow-auto">
      @for (alert of store.alerts(); track alert.id) {
        <div
          [class]="alert.isResolved ? resolvedRowClass : ''"
          [attr.data-resolved]="alert.isResolved"
          class="relative rounded-cmn-md"
          data-testid="alert-row"
        >
          <cmn-alert-item
            [title]="alert.title"
            [message]="alert.message | alertMessage"
            [severity]="severityFor(alert.severity)"
            [icon]="iconFor(alert.type)"
            [badgeLabel]="typeLabel(alert.type)"
            [referenceLabel]="alert.referenceLabel"
            [timestamp]="alert.createdAt"
            [isRead]="alert.isRead || alert.isResolved"
            [description]="alert | alertCaption"
            (dismissed)="dismiss(alert.id)"
            class="[&_button]:relative [&_button]:z-10"
            density="flat"
          />
          <button
            [attr.aria-label]="alert.title"
            (click)="openAlert(alert)"
            class="absolute inset-0 cursor-pointer rounded-cmn-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-border-focus"
            type="button"
            data-testid="alert-row-open"
          ></button>
        </div>
      }
    </div>
  </cmn-async-state>

  @if (store.alerts().length > 0 && showPager()) {
    <nav
      class="mt-cmn-3 flex flex-wrap items-center justify-between gap-cmn-3"
      aria-label="Alerts pages"
      data-testid="alerts-pager"
    >
      <div class="flex items-center gap-cmn-2">
        <cmn-button
          [disabled]="!store.hasPreviousPage()"
          (clicked)="store.setPage(store.currentPage() - 1)"
          variant="secondary"
          size="sm"
          data-testid="alerts-prev"
          icon="ChevronLeft"
          >Previous</cmn-button
        >
        <span class="text-cmn-sm text-text-secondary" data-testid="alerts-page-label">
          Page {{ store.currentPage() }} of {{ store.totalPages() }}
        </span>
        <cmn-button
          [disabled]="!store.hasNextPage()"
          (clicked)="store.setPage(store.currentPage() + 1)"
          variant="secondary"
          size="sm"
          data-testid="alerts-next"
          icon="ChevronRight"
          iconPosition="suffix"
          >Next</cmn-button
        >
      </div>
      <lk-segmented
        [options]="pageSizeOptions"
        [value]="'' + store.pageSize()"
        (lk-segmented-change)="onPageSizeChange($event)"
        label="Alerts per page"
      />
    </nav>
  }
</cmn-page-container>
