<cmn-page kind="list" fill>
  <p class="text-cmn-sm text-text-secondary" data-testid="alerts-subtitle">
    {{ alertsSubtitle() }}
  </p>

  <cmn-filter-bar
    [activeCount]="activeFilterCount()"
    [applied]="appliedFilters()"
    [(query)]="query"
    (remove)="clearFilter()"
    (clear)="clearFilter()"
    placeholder="Search alerts"
    searchLabel="Search alerts"
    data-testid="alerts-filter-bar"
  >
    <ng-template let-close="close" cmnFilterBarSheet>
      <fns-alert-filter-sheet
        [initial]="store.filter()"
        (applied)="store.setFilter($event); close()"
      />
    </ng-template>
  </cmn-filter-bar>

  <cmn-page-scroll label="Alerts">
    <cmn-async-state
      [status]="view().status"
      [errorMessage]="view().errorMessage"
      [isEmpty]="store.alerts().length === 0"
      [emptySubMessage]="emptySubtext()"
      [showDelay]="showDelay"
      [minDisplay]="minDisplay"
      (retry)="store.load(store.query())"
      class="flex flex-1 flex-col"
      crossfade
      retryable
      keepContent
    >
      <div skeleton class="space-y-cmn-4" data-testid="alerts-skeleton">
        @for (_ of skeletonSections; track $index) {
          <cmn-skeleton [count]="skeletonRowsPerSection" shape="section" />
        }
      </div>
      <div empty class="flex min-h-0 flex-1 items-center justify-center">
        <cmn-empty-state
          [message]="emptyTitle()"
          [subMessage]="emptySubtext()"
          [actionLabel]="canShowAll() ? 'Show all alerts' : null"
          (action)="showAll()"
          icon="CheckCircle2"
          iconClass="text-status-success"
        />
      </div>
      <lk-infinite-list
        [hasMore]="store.hasMore()"
        [loading]="store.isAppendLoading()"
        [failed]="store.hasAppendError()"
        (lk-infinite-list-load-more)="store.loadMore()"
        (lk-infinite-list-retry)="store.loadMore()"
        class="block space-y-cmn-4"
        end-label="No more alerts"
        error-label="Couldn't load more alerts."
        data-testid="alerts-list"
      >
        @for (group of dayGroups(); track group.dayKey) {
          <cmn-list-section [heading]="group.label" data-testid="alerts-day">
            @for (alert of group.items; track alert.id) {
              <!-- The dismiss button's 44px ::after hit area (PHONE_HIT_AREA_CLASSES in @lifekit-hq/ui)
                   reaches ~5px past the card, which makes cmn-page-scroll scroll sideways (lifekit-common#338). -->
              <div
                [class]="alert.isResolved ? resolvedRowClass : ''"
                [attr.data-resolved]="alert.isResolved"
                class="overflow-x-clip rounded-cmn-md"
                data-testid="alert-row"
              >
                <cmn-alert-item
                  [title]="alert.title"
                  [message]="alert.message | alertMessage"
                  [severity]="severityFor(alert.severity)"
                  [icon]="iconFor(alert.type)"
                  [badgeLabel]="typeLabel(alert.type)"
                  [referenceLabel]="alert.referenceLabel"
                  [timestamp]="alert.createdAt"
                  [isRead]="alert.isRead || alert.isResolved"
                  [description]="alert | alertCaption"
                  (opened)="openAlert(alert)"
                  (dismissed)="dismiss(alert.id)"
                  density="flat"
                  openable
                />
              </div>
            }
          </cmn-list-section>
        }
      </lk-infinite-list>
    </cmn-async-state>
  </cmn-page-scroll>
</cmn-page>
