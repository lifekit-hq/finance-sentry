<div class="mx-auto flex h-full w-full max-w-[860px] flex-col p-cmn-4 sm:p-cmn-6">
  <cmn-page-header
    [subtitle]="alertsSubtitle()"
    [secondaryActionLabel]="store.unreadCount() > 0 ? 'Mark all read' : null"
    (secondaryClick)="markAllRead()"
    title="Alerts"
    secondaryActionIcon="CheckCheck"
  />

  <div class="mt-cmn-4 flex gap-cmn-2 overflow-x-auto">
    @for (opt of filterOptions; track opt.id) {
      <cmn-chip [selected]="store.filter() === opt.id" (clicked)="store.setFilter(opt.id)">
        {{ opt.label() }}
      </cmn-chip>
    }
  </div>

  @if (filtered().length === 0) {
    <div class="flex min-h-0 flex-1 items-center justify-center">
      <cmn-empty-state
        [message]="emptyTitle()"
        [subMessage]="emptySubtext()"
        icon="CheckCircle2"
        iconClass="text-status-success"
      />
    </div>
  } @else {
    <div class="mt-cmn-3 min-h-0 flex-1 overflow-auto">
      @for (alert of filtered(); track alert.id) {
        <div
          (click)="openAlert(alert)"
          (keydown.enter)="openAlert(alert)"
          class="rounded-cmn-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-border-focus"
          role="button"
          tabindex="0"
        >
          <cmn-alert-item
            [title]="alert.title"
            [message]="alert.message | alertMessage"
            [severity]="severityFor(alert.severity)"
            [icon]="iconFor(alert.type)"
            [badgeLabel]="typeLabel(alert.type)"
            [referenceLabel]="alert.referenceLabel"
            [timestamp]="alert.createdAt"
            [isRead]="alert.isRead"
            (dismissed)="dismiss(alert.id)"
            density="flat"
          />
        </div>
      }
    </div>
  }
</div>
