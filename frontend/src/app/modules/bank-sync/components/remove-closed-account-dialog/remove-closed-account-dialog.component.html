<p class="text-cmn-sm text-text-secondary">
  <strong class="text-text-primary">{{ data.accountLabel }}</strong>
  and its transaction history will be removed from Finance Sentry. This can't be undone. To keep the
  history, close this and choose Reopen instead.

<cmn-dialog-actions align="end">
  <cmn-button (clicked)="cancel()" variant="secondary">Cancel</cmn-button>
  <cmn-button (clicked)="confirm()" variant="destructive">Remove</cmn-button>
</cmn-dialog-actions>
