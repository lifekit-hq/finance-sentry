@if (store.isBusy()) {
  <fns-syncing-state />
}
<!-- Keep the current step alive (hidden) while busy so a failed submit returns
     the user to their still-populated form instead of a fresh instance. -->
<div [class.hidden]="store.isBusy()">
  @switch (store.modalStep()) {
    @case ('type-picker') {
      <fns-type-picker />
    }
    @case ('provider-picker') {
      <fns-provider-picker />
    }
    @default {
      @if (formComponent(); as cmp) {
        <ng-container *ngComponentOutlet="cmp; injector: formInjector() ?? undefined" />
      }
    }
  }
</div>
