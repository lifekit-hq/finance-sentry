<cmn-async-state
  [status]="inzhur.asyncStatus()"
  [errorMessage]="inzhur.loadErrorMessage()"
  [skeletonRows]="3"
  skeletonHeight="48px"
>
  <form [formGroup]="sessionForm" (ngSubmit)="connect()" class="flex flex-col gap-cmn-6">
    @if (inzhur.isReconnect()) {
      <cmn-alert variant="warning" icon="RefreshCw" title="Inzhur needs a new session">
        The saved session ended. Sign in on inzhur.reit again and paste a fresh one to resume the
        daily sync.
      </cmn-alert>
    }

    <ol class="list-decimal space-y-cmn-2 pl-cmn-5 text-cmn-sm">
      @for (step of sessionSteps; track step) {
        <li>{{ step }}</li>
      }
    </ol>

    <cmn-form-field
      [control]="sessionForm.controls.refreshToken"
      [hint]="sessionNote"
      label="Paste Inzhur session"
    >
      <cmn-input
        formControlName="refreshToken"
        type="password"
        autocomplete="off"
        placeholder="refreshToken value"
      />
    </cmn-form-field>

    @if (store.errorMessage()) {
      <cmn-alert variant="error">{{ store.errorMessage() }}</cmn-alert>
    }

    <cmn-alert variant="accent" icon="ShieldCheck" title="Read-only">
      {{ readOnlyNote }}
    </cmn-alert>

    <cmn-dialog-actions align="between">
      <cmn-button (clicked)="back()" variant="secondary" icon="ArrowLeft">Back</cmn-button>
      <cmn-button
        [loading]="store.isBusy()"
        [disabled]="store.isBusy()"
        variant="primary"
        type="submit"
      >
        Connect
      </cmn-button>
    </cmn-dialog-actions>
  </form>
</cmn-async-state>
