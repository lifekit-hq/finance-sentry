<form [formGroup]="form" (ngSubmit)="submit()" class="space-y-cmn-3">
  <cmn-form-field
    [control]="form.controls.label"
    label="Name"
    hint="What you call it, e.g. Steam wallet"
  >
    <cmn-input
      formControlName="label"
      autocomplete="off"
      enterkeyhint="next"
      placeholder="Steam wallet"
    />
  </cmn-form-field>
  <cmn-form-field
    [control]="form.controls.amount"
    label="Value"
    hint="What you would receive after fees, not the price you paid"
  >
    <cmn-input
      formControlName="amount"
      type="number"
      inputmode="decimal"
      enterkeyhint="next"
      placeholder="0.00"
    />
  </cmn-form-field>
  <div>
    <label
      for="manual-holding-currency"
      class="mb-1 block font-label text-cmn-xs font-semibold uppercase tracking-widest text-text-secondary"
    >
      Currency
    </label>
    <cmn-select
      [options]="currencyOptions"
      formControlName="currency"
      id="manual-holding-currency"
    />
  </div>
  <div>
    <label
      for="manual-holding-convertibility"
      class="mb-1 block font-label text-cmn-xs font-semibold uppercase tracking-widest text-text-secondary"
    >
      Where you can spend it
    </label>
    <cmn-select
      [options]="convertibilityOptions"
      formControlName="convertibility"
      id="manual-holding-convertibility"
    />
    <p class="mt-1 text-cmn-xs text-text-secondary">
      It counts in your total net worth either way; only cash counts as cash.
    </p>
  </div>
  <cmn-dialog-actions align="end">
    <cmn-button (clicked)="cancel()" variant="secondary">Cancel</cmn-button>
    <cmn-button type="submit" variant="primary">{{ isEdit ? 'Save' : 'Add' }}</cmn-button>
  </cmn-dialog-actions>
</form>
