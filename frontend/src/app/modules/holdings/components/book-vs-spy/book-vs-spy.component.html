<cmn-async-state
  [status]="store.status()"
  [errorMessage]="store.errorMessage()"
  [keepContent]="false"
  (retry)="store.load()"
  emptySubMessage="The book against SPY shows once a window was measured for both."
  retryable
>
  <cmn-skeleton skeleton class="block px-cmn-4 py-cmn-3" height="1rem" width="70%" />

  @if (store.comparison(); as comparison) {
    <cmn-list-item-row
      [label]="'Book vs SPY'"
      [sublabel]="'since ' + (comparison.from | date: 'd MMM y')"
      data-testid="book-vs-spy"
    >
      <span amount class="flex items-baseline gap-cmn-2 text-cmn-sm">
        @if (comparison.headline; as headline) {
          <fns-headline-badge [headline]="headline" label="Book return" />
        }
        <span class="tabular-nums text-text-primary" data-testid="book-vs-spy-returns">
          {{ comparison.bookReturn }} vs {{ comparison.benchmarkReturn }}
        </span>
        @if (comparison.qqqReturn; as qqqReturn) {
          <span class="tabular-nums text-text-secondary" data-testid="book-vs-qqq-returns">
            QQQ {{ qqqReturn }}
          </span>
        }
      </span>
    </cmn-list-item-row>
  }
</cmn-async-state>
