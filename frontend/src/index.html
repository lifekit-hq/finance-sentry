<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Finance Sentry</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1120" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The CSP admits this inline script by its sha256 (docker/nginx.security-headers.conf):
         any edit to it, whitespace included, needs the new hash there or the browser blocks it. -->
    <script>
      // Apply the stored/OS theme before first paint so guest pages never flash light.
      (function () {
        var theme = 'light';
        try {
          var stored = localStorage.getItem('cmn-theme');
          if (stored === 'dark' || stored === 'light') theme = stored;
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <!-- Installed iOS PWA: draw under the status bar instead of an opaque system band above the app. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script src="https://accounts.google.com/gsi/client" async></script>
  </head>
  <body>
    <fns-root></fns-root>
  </body>
</html>
