    <!-- prettier-ignore -->
    <script>// Apply the stored/OS theme before first paint so pages never flash light.
(function () {
  var theme = 'light';
  try {
    var stored = localStorage.getItem('cmn-theme');
    if (stored === 'dark' || stored === 'light') theme = stored;
    else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
  } catch (e) {}
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
