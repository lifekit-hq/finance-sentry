# Security response headers for the frontend container: included at server level and again in every
# location that sets its own add_header (nginx drops inherited add_header lines in such a block).
#
# The gateway sends the same set (backend/src/FinanceSentry.Gateway/appsettings.json,
# Gateway:SecurityHeaders), which must be kept in step by hand (except the theme-script hash, which
# frontend/scripts/sync-theme-script.mjs rewrites in both files); the Playwright
# e2e server (frontend/e2e/serve.mjs) reads this file, so every e2e spec runs under this exact policy.
# Keep each directive on one line in the form `add_header <Name> "<value>" always;`.
#
# CSP admits what the SPA loads today and nothing broader:
#   script  - own bundles, the inline theme bootstrap in index.html (by sha256; the hash is rewritten by
#             frontend/scripts/sync-theme-script.mjs, never edited by hand)
#   style   - own CSS, Angular's runtime component <style> tags ('unsafe-inline')
#   img     - asset logos (CoinCap, Financial Modeling Prep), institution favicons (Google's favicon
#             service and the gstatic hosts it redirects to), TrueLayer provider logos
#   connect - same-origin API and the img hosts above: the Angular service worker fetches every
#             cross-origin logo itself, and a worker-context fetch is checked against the worker
#             script's connect-src, not img-src. One policy rather than a tighter one for
#             /ngsw-worker.js: the gateway replaces the CSP on every response and would need the same
#             per-path rule, and these hosts are already reachable from the page as images.
#             Keep this host list equal to img-src (security-headers.spec.ts pins it).
#   frame   - none beyond default-src 'self' (sign-in is a top-level redirect to the identity provider)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-1CdonPxh0ooZS+15UPGry+te8K78Ih2R0PkG9xcbnyU='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://assets.coincap.io https://financialmodelingprep.com https://www.google.com https://*.gstatic.com https://truelayer-provider-assets.s3.amazonaws.com; font-src 'self' data:; connect-src 'self' https://assets.coincap.io https://financialmodelingprep.com https://www.google.com https://*.gstatic.com https://truelayer-provider-assets.s3.amazonaws.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
