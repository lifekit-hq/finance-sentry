# Security response headers for the frontend container: included at server level and again in every
# location that sets its own add_header (nginx drops inherited add_header lines in such a block).
#
# The gateway sends the same set (backend/src/FinanceSentry.Gateway/appsettings.json,
# Gateway:SecurityHeaders), which must be kept in step by hand; the Playwright
# e2e server (frontend/e2e/serve.mjs) reads this file, so every e2e spec runs under this exact policy.
# Keep each directive on one line in the form `add_header <Name> "<value>" always;`.
#
# CSP admits what the SPA loads today and nothing broader:
#   script  - own bundles, the inline theme bootstrap in index.html (by sha256), Google Identity Services
#   style   - own CSS, Angular's runtime component <style> tags ('unsafe-inline'), the GIS button style
#   img     - asset logos (CoinCap, Financial Modeling Prep), institution favicons (Google's favicon
#             service and the gstatic hosts it redirects to), TrueLayer provider logos
#   connect - same-origin API, GIS
#   frame   - the GIS sign-in button iframe
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-rBg4MkDyJkEM2VEJCHjd3fyo+RBEz/LPnwdnbXhvI9g=' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://assets.coincap.io https://financialmodelingprep.com https://www.google.com https://*.gstatic.com https://truelayer-provider-assets.s3.amazonaws.com; font-src 'self' data:; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
