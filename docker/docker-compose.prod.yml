# Production stack for finance-sentry.
#
# Designed to run on the lifekit-vps via a self-hosted GitHub runner that builds
# images locally (no external registry). Services bind to 127.0.0.1 — public
# access is fronted by Tailscale Serve on the host (configured in deploy.sh).
#
# Deploy: ./docker/deploy.sh   (which runs sops decrypt + compose up).
# Env source: docker/.env  (decrypted from docker/.env.sops via sops/age).

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      platforms: [linux/arm64]
    image: finance-sentry/api:local
    container_name: finance-sentry-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft: Warning
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${DB_NAME:-finance_sentry};Username=${DB_USER:-finance_user};Password=${DB_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-https://finance-sentry.tail1cb676.ts.net}
      Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-60}
      Deduplication__MasterKeyBase64: ${DEDUPLICATION_MASTER_KEY_BASE64}
      # AES-256-GCM keys for stored bank credentials (issue #493). REQUIRED: outside
      # Development the API refuses to start without a usable current key, rather than
      # silently encrypting under a key committed to this repository — which is what it
      # did until 2026-09-09.
      #
      # V1 is the OLD key the existing rows were written under. It stays configured,
      # read-only, so startup rotation can DECRYPT them; it is never written with, because
      # CurrentKeyVersion points at 2. Do NOT put a fresh key at V1: version 1 would then
      # name a different key, every existing credential would fail to decrypt, and rotation
      # would migrate nothing because every row already reads version 1.
      #
      # V2 is the new key: `openssl rand -base64 32`. Provision it in docker/.env.sops.
      # Startup rotation re-encrypts every row v1 -> v2 and logs how many it moved. Once a
      # boot logs 0 rows migrated, drop ENCRYPTION_KEY_V1 and the disclosure is closed.
      Encryption__Keys__1: ${ENCRYPTION_KEY_V1:-}
      Encryption__Keys__2: ${ENCRYPTION_KEY_V2:-}
      Encryption__CurrentKeyVersion: ${ENCRYPTION_CURRENT_KEY_VERSION:-2}
      GOOGLEOAUTH__CLIENTID: ${GOOGLE_CLIENT_ID:-}
      # TrueLayer (Open Banking EU/UK). Production URLs — creds in .env are the
      # live console.truelayer.com set, not sandbox. Override with
      # TRUELAYER_AUTH_BASE_URL=https://auth.truelayer-sandbox.com to force
      # sandbox for testing.
      TrueLayer__AuthBaseUrl: ${TRUELAYER_AUTH_BASE_URL:-https://auth.truelayer.com}
      TrueLayer__ApiBaseUrl: ${TRUELAYER_API_BASE_URL:-https://api.truelayer.com}
      TrueLayer__ClientId: ${TRUELAYER_CLIENT_ID:-}
      TrueLayer__ClientSecret: ${TRUELAYER_CLIENT_SECRET:-}
      TrueLayer__FrontendRedirectBase: ${TRUELAYER_FRONTEND_REDIRECT_BASE:-https://lifekit-vps.tail1cb676.ts.net:4200}
      TrueLayer__CallbackPath: /api/v1/accounts/truelayer/callback
      AnalystSources__Finnhub__ApiKey: ${FINNHUB_API_KEY:-}
      Regime__Fred__ApiKey: ${FRED_API_KEY:-}
      # In-app finance agent / browser Ledger (feature 040). Empty = agent disabled (keyless-graceful).
      Agent__Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      # Alt brain: delegate the chat to the existing OpenClaw Ledger (finance) agent — no Anthropic key
      # needed. Set BaseUrl+Token to enable (auto-selected when no Anthropic key is present).
      Agent__OpenClaw__BaseUrl: ${OPENCLAW_GATEWAY_URL:-}
      Agent__OpenClaw__Token: ${OPENCLAW_GATEWAY_TOKEN:-}
      # Off-host encrypted backups (feature 024). Empty = backup jobs no-op (dev/local safe).
      Backup__R2Endpoint: ${BACKUP_R2_ENDPOINT:-}
      Backup__R2Bucket: ${BACKUP_R2_BUCKET:-}
      Backup__R2AccessKey: ${BACKUP_R2_ACCESS_KEY:-}
      Backup__R2SecretKey: ${BACKUP_R2_SECRET_KEY:-}
      Backup__AgeRecipient: ${BACKUP_AGE_RECIPIENT:-}
      Backup__AgeIdentity: ${BACKUP_AGE_IDENTITY:-}
      # Public base of the API itself — used to build the OAuth redirect_uri TrueLayer sends the
      # browser back to after consent. This MUST exactly match a redirect URI registered in the
      # TrueLayer console, or consent is rejected. Default is the console-registered
      # http://localhost:5001; the browser redirect then dead-ends locally but the callback is
      # recoverable server-side. To enable true one-tap reconnect, register
      # https://lifekit-vps.tail1cb676.ts.net:5001/api/v1/accounts/truelayer/callback in the
      # console, then set PUBLIC_API_BASE_URL=https://lifekit-vps.tail1cb676.ts.net:5001 here.
      PublicApiBaseUrl: ${PUBLIC_API_BASE_URL:-http://localhost:5001}
      TrueLayer__Scopes: "info accounts balance transactions cards offline_access"
      # Ship structured logs to Loki (fire-and-forget); empty disables the sink.
      # Loki lives in lifekit-stack's compose project since 2026-09-06; the
      # service name still resolves over the shared `openclaw` bridge.
      Observability__Loki__Url: ${OBSERVABILITY_LOKI_URL:-http://loki:3100}
    # No host port — reachable only via the gateway (025 cutover, 2026-08-12).
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finance-sentry
      - openclaw          # shared with OpenClaw agents so they can reach the API directly
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - api_logs:/app/logs
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
      platforms: [linux/arm64]
    image: finance-sentry/mcp:local
    container_name: finance-sentry-mcp
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${DB_NAME:-finance_sentry};Username=${DB_USER:-finance_user};Password=${DB_PASSWORD}"
      Deduplication__MasterKeyBase64: ${DEDUPLICATION_MASTER_KEY_BASE64}
      Jwt__Secret: ${JWT_SECRET}
      Mcp__ApiBaseUrl: http://api:5000/api/v1
      Mcp__FrontendBaseUrl: ${FRONTEND_BASE_URL:-http://localhost:4200}
      # Streamable HTTP transport. OpenClaw can't spawn docker-exec from inside its
      # gateway container, so we expose MCP over HTTP on the shared compose_default
      # network. Reachable from openclaw container as http://finance-sentry-mcp:5100/.
      MCP_TRANSPORT: http
      MCP_HTTP_PORT: "5100"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finance-sentry
      - openclaw          # ledger agent reaches the MCP container by name on this bridge
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend.prod
      platforms: [linux/arm64]
      secrets: [npm_token]
    image: finance-sentry/frontend:local
    container_name: finance-sentry-frontend
    restart: unless-stopped
    # No host port — reachable only via the gateway (025 cutover, 2026-08-12).
    depends_on:
      # Ordering only — NOT service_healthy. During a recreate the old and new api
      # containers briefly overlap and contend on the ~14 per-context EF migration
      # locks; a slow/transient-unhealthy api under service_healthy aborts the whole
      # `compose up`, leaving the frontend never started (outage on 2026-08-07).
      # deploy.sh gates real readiness with its own 120s api health-poll loop, so
      # nginx just 502s for a few seconds until the api is up — no aborted deploy.
      api:
        condition: service_started
    networks:
      - finance-sentry
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # --- Edge gateway (025) — single YARP reverse-proxy front door -----------------------------------
  # CUTOVER DONE (2026-08-12): the gateway is the sole entrypoint. Tailscale Serve fronts
  # loopback:8080 on :4200 and :5001 (both URLs kept working, now path-routed by YARP); the
  # frontend/api host ports are closed. Rollback: re-add the ports: blocks and repoint serve.
  #
  # TLS: default is Tailscale-terminated — the gateway serves plain HTTP on loopback:8080 and
  # `tailscale serve` fronts it. To switch to public-domain ACME instead, set the LettuceEncrypt env
  # below (DomainNames + EmailAddress + AcceptTermsOfService=true) and uncomment the 80/443 ports.
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
      platforms: [linux/arm64]
    image: finance-sentry/gateway:local
    container_name: finance-sentry-gateway
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Public-domain ACME (leave empty for Tailscale-terminated mode):
      LettuceEncrypt__DomainNames__0: ${GATEWAY_DOMAIN:-}
      LettuceEncrypt__EmailAddress: ${GATEWAY_ACME_EMAIL:-}
      LettuceEncrypt__AcceptTermsOfService: ${GATEWAY_ACME_ACCEPT_TOS:-false}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
      # ACME cutover: uncomment to publish the public TLS ports (requires GATEWAY_DOMAIN + DNS).
      # - "80:80"
      # - "443:443"
    volumes:
      - gateway_acme:/root/.aspnet/DataProtection-Keys
    depends_on:
      api:
        condition: service_started
    networks:
      - finance-sentry
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  postgres:
    image: postgres:14-alpine
    container_name: finance-sentry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-finance_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-finance_sentry}
    command: postgres -c max_connections=200 -c shared_buffers=256MB
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finance-sentry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-finance_user} -d ${DB_NAME:-finance_sentry}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # --- Observability ------------------------------------------------------------------------------
  # The loki / prometheus / grafana trio MOVED to lifekit-stack's compose project
  # on 2026-09-06 (lifekit-hq/lifekit-stack#133). It was box infrastructure living
  # in one product's compose file, on this product's private network — which is why
  # Prometheus could only ever see one target and nothing else on the box had
  # alerting at all. It now scrapes devclaw too and carries the alert rules.
  #
  # What stays this repo's job: the API's /metrics endpoint, the Loki sink below,
  # and the dashboards under observability/grafana/dashboards/ — deploy.sh
  # publishes those to the directory lifekit-stack's Grafana provisions from, so
  # each dashboard still has exactly one home, here.
  #
  # api reaches the moved Loki unchanged: it is on the `openclaw` bridge
  # (compose_default), where lifekit-stack's `loki` service name resolves.

volumes:
  postgres_data:
  api_logs:
  gateway_acme:   # ACME cert + data-protection key cache (025) — only used when TLS/ACME is enabled

networks:
  finance-sentry:
    name: finance-sentry
  openclaw:
    external: true
    name: compose_default       # OpenClaw + devclaw + gateway live on this bridge on the VPS

# GitHub Packages token for @lifekit-hq/* installs (BuildKit secret — not in layers).
# Locally: export NODE_AUTH_TOKEN=$(gh auth token)  (needs read:packages scope).
# CI/deploy: the workflow passes secrets.GITHUB_TOKEN.
secrets:
  npm_token:
    environment: NODE_AUTH_TOKEN
