# Production stack for finance-sentry.
#
# Designed to run on the lifekit-vps via a self-hosted GitHub runner. api, mcp, frontend and
# gateway run the images Docker Build published for one commit — ghcr.io/lifekit-hq/
# finance-sentry-<service>:<commit SHA> — selected by IMAGE_TAG (deploy.sh requires it; unset
# means a locally built `:local`, never `:main`). Their `build:` blocks stay for the break-glass
# path documented in deploy.sh. Services bind to 127.0.0.1 — public access is fronted by
# Tailscale Serve on the host (configured in deploy.sh).
#
# Deploy: IMAGE_TAG=<sha> ./docker/deploy.sh   (sops decrypt + compose pull + up).
# Env source: docker/.env  (decrypted from docker/.env.sops via sops/age).
#
# Platform contract (guardrail 1, spec 048): every traffic-serving service declares how it meets
# the contract in `lifekit.contract.*` labels (reference: the docstring of
# /srv/lifekit-stack/scripts/platform-contract.py). deploy.sh runs that checker as a static gate
# on this file before `up` and as a runtime gate on the containers afterwards; a failing label set
# never deploys, a failing probe turns the deploy red. Datastores are `none`. No waivers.
#
# Container hardening: every service runs as a non-root user, drops all Linux capabilities (postgres
# adds back only the ones its entrypoint needs to hand its data directory to the `postgres` user),
# sets no-new-privileges and a pids limit, and mounts its root filesystem read-only with tmpfs for
# the paths it writes at runtime. Named volumes stay writable.

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      platforms: [linux/arm64]
    image: ghcr.io/lifekit-hq/finance-sentry-api:${IMAGE_TAG:-local}
    container_name: finance-sentry-api
    restart: unless-stopped
    mem_limit: 1g           # 1.3 budget: 7-day peak 616 MiB
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      # .NET diagnostics sockets, plus the backup and restore-verify jobs' transient plain dump and
      # its encrypted copy (~35 MB each today). Capped at 256m: tmpfs counts against mem_limit, so an
      # oversized dump fails the job with ENOSPC instead of OOM-killing the api. Logs go to the api_logs volume.
      - /tmp:size=256m
    labels:
      lifekit.contract: "v1"
      lifekit.contract.port: "5000"
      lifekit.contract.health: /api/v1/health
      lifekit.contract.ready: /api/v1/health/ready
      lifekit.contract.metrics: /metrics
      lifekit.contract.ingress: internal
      lifekit.contract.service: finance-sentry-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft: Warning
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${DB_NAME:-finance_sentry};Username=${DB_USER:-finance_user};Password=${DB_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:?set JWT_ISSUER to the public https origin the API is served under}
      # Wraps the Data Protection key ring (invite tokens, OIDC state cookies), which the api keeps in the Auth
      # database because its filesystem is read-only. Base64 of a password-less PKCS#12 with an RSA key; the mcp
      # host takes the same value because it shares that ring. A self-signed one is enough:
      #   openssl req -x509 -newkey rsa:2048 -nodes -keyout k.pem -out c.pem -subj /CN=finance-sentry-dataprotection -days 3650
      #   openssl pkcs12 -export -inkey k.pem -in c.pem -passout pass: | base64 -w0
      # Rotating it means re-wrapping the stored keys, so keep it for as long as the ring has keys.
      DataProtection__CertificatePfxBase64: ${DATA_PROTECTION_CERT_PFX_BASE64:?set DATA_PROTECTION_CERT_PFX_BASE64 (docker/.env.sops) to protect the Data Protection key ring at rest}
      Jwt__ExpiryMinutes: ${JWT_EXPIRATION_MINUTES:-60}
      Deduplication__MasterKeyBase64: ${DEDUPLICATION_MASTER_KEY_BASE64}
      # AES-256-GCM keys for stored bank credentials (issue #493). REQUIRED: outside
      # Development the API refuses to start without a usable current key, rather than
      # silently encrypting under a key committed to this repository — which is what it
      # did until 2026-09-09.
      #
      # V1 is the OLD key the existing rows were written under. It stays configured,
      # read-only, so startup rotation can DECRYPT them; it is never written with, because
      # CurrentKeyVersion points at 2. Do NOT put a fresh key at V1: version 1 would then
      # name a different key, every existing credential would fail to decrypt, and rotation
      # would migrate nothing because every row already reads version 1.
      #
      # V2 is the new key: `openssl rand -base64 32`. Provision it in docker/.env.sops.
      # Startup rotation re-encrypts every row v1 -> v2 and logs how many it moved. Once a
      # boot logs 0 rows migrated, drop ENCRYPTION_KEY_V1 and the disclosure is closed.
      Encryption__Keys__1: ${ENCRYPTION_KEY_V1:-}
      Encryption__Keys__2: ${ENCRYPTION_KEY_V2:-}
      Encryption__CurrentKeyVersion: ${ENCRYPTION_CURRENT_KEY_VERSION:-2}
      # TrueLayer (Open Banking EU/UK). Production URLs — creds in .env are the
      # live console.truelayer.com set, not sandbox. Override with
      # TRUELAYER_AUTH_BASE_URL=https://auth.truelayer-sandbox.com to force
      # sandbox for testing.
      TrueLayer__AuthBaseUrl: ${TRUELAYER_AUTH_BASE_URL:-https://auth.truelayer.com}
      TrueLayer__ApiBaseUrl: ${TRUELAYER_API_BASE_URL:-https://api.truelayer.com}
      TrueLayer__ClientId: ${TRUELAYER_CLIENT_ID:-}
      TrueLayer__ClientSecret: ${TRUELAYER_CLIENT_SECRET:-}
      TrueLayer__FrontendRedirectBase: ${TRUELAYER_FRONTEND_REDIRECT_BASE:?set TRUELAYER_FRONTEND_REDIRECT_BASE to the frontend origin}
      TrueLayer__CallbackPath: /api/v1/accounts/truelayer/callback
      AnalystSources__Finnhub__ApiKey: ${FINNHUB_API_KEY:-}
      Regime__Fred__ApiKey: ${FRED_API_KEY:-}
      # In-app finance agent / browser Ledger (feature 040). Empty = agent disabled (keyless-graceful).
      Agent__Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      # Alt brain: delegate the chat to the existing OpenClaw Ledger (finance) agent — no Anthropic key
      # needed. Set BaseUrl+Token to enable (auto-selected when no Anthropic key is present).
      Agent__OpenClaw__BaseUrl: ${OPENCLAW_GATEWAY_URL:-}
      Agent__OpenClaw__Token: ${OPENCLAW_GATEWAY_TOKEN:-}
      # Companion realtime wake (#643): POST to the gateway's finance-sentry-companion hook mapping.
      # Empty URL = no push; the pulse stays as the backstop either way.
      Companion__AgentTriggerUrl: ${COMPANION_AGENT_TRIGGER_URL:-}
      Companion__AgentTriggerToken: ${COMPANION_AGENT_TRIGGER_TOKEN:-}
      # Absolute app links (appUrl) on the wake payload; empty = none emitted. The MCP host binds the same value below.
      Companion__PublicBaseUrl: ${FRONTEND_BASE_URL:-}
      # Off-host encrypted backups (feature 024). Empty = backup jobs no-op (dev/local safe).
      Backup__R2Endpoint: ${BACKUP_R2_ENDPOINT:-}
      Backup__R2Bucket: ${BACKUP_R2_BUCKET:-}
      Backup__R2AccessKey: ${BACKUP_R2_ACCESS_KEY:-}
      Backup__R2SecretKey: ${BACKUP_R2_SECRET_KEY:-}
      Backup__AgeRecipient: ${BACKUP_AGE_RECIPIENT:-}
      Backup__AgeIdentity: ${BACKUP_AGE_IDENTITY:-}
      # Web Push (spec 859). VAPID keypair for in-app push; empty = push disabled (keyless-graceful:
      # the public-key endpoint reports unavailable and the sender job no-ops). Subject is a mailto: or https: contact.
      WebPush__PublicKey: ${WEBPUSH_PUBLIC_KEY:-}
      WebPush__PrivateKey: ${WEBPUSH_PRIVATE_KEY:-}
      WebPush__Subject: ${WEBPUSH_SUBJECT:-}
      # Public base of the API itself — used to build the OAuth redirect_uri TrueLayer sends the
      # browser back to after consent. This MUST exactly match a redirect URI registered in the
      # TrueLayer console (<origin>/api/v1/accounts/truelayer/callback), or consent is rejected.
      PublicApiBaseUrl: ${PUBLIC_API_BASE_URL:?set PUBLIC_API_BASE_URL to the API origin registered in the TrueLayer console}
      TrueLayer__Scopes: "info accounts balance transactions cards offline_access"
      # Ship structured logs to Loki (fire-and-forget); empty disables the sink.
      # Loki lives in lifekit-stack's compose project since 2026-09-06; the
      # service name still resolves over the shared `lifekit-shared` network.
      Observability__Loki__Url: ${OBSERVABILITY_LOKI_URL:-http://loki:3100}
      # Trace spine (spec 023 amendment, 2026-09-13): OTLP/HTTP exporter. The collector lives in
      # lifekit-stack's compose project on the shared `lifekit-shared` network, same as Loki above.
      Observability__Otlp__Endpoint: ${OBSERVABILITY_OTLP_ENDPOINT:-http://otel-collector:4318}
      # X-Forwarded-* is honoured only from the gateway's fixed address on finance-sentry-edge;
      # from any other sender the API keeps the socket address.
      ForwardedHeaders__KnownProxies__0: ${EDGE_GATEWAY_IP:?set EDGE_GATEWAY_IP to the gateway address on the edge network}
      # Account granted the Owner role at startup (Hangfire dashboard, owner-only features). Empty =
      # promote the sole registered user while nobody holds the role. Not a secret. See the runbook §4.
      Auth__OwnerEmail: ${AUTH_OWNER_EMAIL:-}
      # Password sign-in (login and invite acceptance) is fixed off in production: Logto is the only way in. The code
      # default is on, so this literal must stay; there is deliberately no env override.
      Auth__PasswordLogin__Enabled: "false"
      # Account the post-deploy live smoke signs in as, through Logto: seeded at startup as a passwordless Member
      # with fake data, never the owner. It must carry the email of the dedicated Logto smoke user. Empty = no seed.
      # The deploy workflow passes it from the E2E_LIVE_LOGTO_EMAIL GitHub Actions secret, not docker/.env.sops.
      Auth__SmokeAccount__Email: ${SMOKE_ACCOUNT_EMAIL:-}
      # Org identity provider (Logto) sign-in. Off unless all of authority, client id, secret and the
      # app's public URL are set. The client secret belongs in docker/.env.sops, never in clear.
      Auth__Oidc__Authority: ${AUTH_OIDC_AUTHORITY:-}
      Auth__Oidc__ClientId: ${AUTH_OIDC_CLIENT_ID:-}
      Auth__Oidc__ClientSecret: ${AUTH_OIDC_CLIENT_SECRET:-}
      Auth__Oidc__PublicBaseUrl: ${AUTH_OIDC_PUBLIC_BASE_URL:-}
      # The API's own discovery/JWKS/token/userinfo calls go over the identity-oidc docker network (a container
      # cannot reliably reach the host's tailnet address); the issuer and the browser stay on the public Authority.
      Auth__Oidc__BackchannelAuthority: ${AUTH_OIDC_BACKCHANNEL_AUTHORITY:-http://logto:3001/oidc}
      Auth__Oidc__RequireHttpsMetadata: ${AUTH_OIDC_REQUIRE_HTTPS_METADATA:-true}
      # Inzhur sign-in runs in the inzhur-browser sidecar (owner-initiated only; the daily sync never opens it).
      Inzhur__BrowserUrl: http://inzhur-browser:9222
    # No host port — reachable only via the gateway (025 cutover, 2026-08-12).
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      finance-sentry: {}
      lifekit-shared: {}   # agents on the shared network reach the API directly; Loki/OTLP by name
      identity-oidc: {}    # back channel to the org identity provider (Logto) by name
      finance-sentry-edge:
        aliases: [api-edge]   # the gateway's upstream — see finance-sentry-edge below
      inzhur-browser: {}   # DevTools hop to the Inzhur sign-in sidecar, shared with nothing else
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - api_logs:/app/logs
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
      platforms: [linux/arm64]
    image: ghcr.io/lifekit-hq/finance-sentry-mcp:${IMAGE_TAG:-local}
    container_name: finance-sentry-mcp
    restart: unless-stopped
    mem_limit: 384m         # 1.3 budget: 7-day peak 208 MiB
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp                # .NET diagnostics sockets
    labels:
      lifekit.contract: "v1"
      lifekit.contract.port: "5100"
      lifekit.contract.health: /health        # anonymous — [AllowAnonymous] in McpPlatformEndpoints
      lifekit.contract.ready: /ready          # Npgsql check, api-shaped JSON
      lifekit.contract.metrics: /metrics      # scraped as job finance-sentry-mcp (lifekit-stack prometheus.yml)
      lifekit.contract.ingress: internal
      lifekit.contract.service: finance-sentry-mcp
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${DB_NAME:-finance_sentry};Username=${DB_USER:-finance_user};Password=${DB_PASSWORD}"
      Deduplication__MasterKeyBase64: ${DEDUPLICATION_MASTER_KEY_BASE64}
      Jwt__Secret: ${JWT_SECRET}
      DataProtection__CertificatePfxBase64: ${DATA_PROTECTION_CERT_PFX_BASE64:?see the api service}
      Mcp__ApiBaseUrl: http://api:5000/api/v1
      Mcp__FrontendBaseUrl: ${FRONTEND_BASE_URL:?set FRONTEND_BASE_URL to the frontend origin}
      Companion__PublicBaseUrl: ${FRONTEND_BASE_URL}
      # Streamable HTTP transport. OpenClaw can't spawn docker-exec from inside its
      # gateway container, so we expose MCP over HTTP on the shared lifekit-shared
      # network. Reachable from the openclaw container as http://finance-sentry-mcp:5100/.
      MCP_TRANSPORT: http
      MCP_HTTP_PORT: "5100"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finance-sentry
      - lifekit-shared     # ledger agent reaches the MCP container by name on this network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend.prod
      platforms: [linux/arm64]
      secrets: [npm_token]
    image: ghcr.io/lifekit-hq/finance-sentry-frontend:${IMAGE_TAG:-local}
    container_name: finance-sentry-frontend
    restart: unless-stopped
    mem_limit: 64m          # 1.3 budget: 7-day peak 13 MiB
    pids_limit: 100
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp                # nginx-unprivileged keeps its pid file and client/proxy temp dirs here
    labels:
      lifekit.contract: "v1"
      lifekit.contract.port: "4200"
      lifekit.contract.health: /healthz       # nginx.frontend.conf — JSON, never the SPA fallback
      lifekit.contract.ready: /readyz         # 503 when the built bundle is missing
      lifekit.contract.metrics: /metrics      # stub_status → Prometheus via njs (nginx.metrics.js)
      lifekit.contract.ingress: internal
      lifekit.contract.service: finance-sentry-frontend
    # No host port — reachable only via the gateway (025 cutover, 2026-08-12).
    depends_on:
      # Ordering only — NOT service_healthy. During a recreate the old and new api
      # containers briefly overlap and contend on the ~14 per-context EF migration
      # locks; a slow/transient-unhealthy api under service_healthy aborts the whole
      # `compose up`, leaving the frontend never started (outage on 2026-08-07).
      # deploy.sh gates real readiness with its own 120s api health-poll loop, so
      # nginx just 502s for a few seconds until the api is up — no aborted deploy.
      api:
        condition: service_started
    networks:
      - finance-sentry
      - lifekit-shared     # so lifekit-stack's Prometheus can scrape /metrics (spec 048)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4200/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # --- Edge gateway (025) — single YARP reverse-proxy front door -----------------------------------
  # CUTOVER DONE (2026-08-12): the gateway is the sole entrypoint. Tailscale Serve fronts
  # loopback:8080 on :4200 and :5001 (both URLs kept working, now path-routed by YARP); the
  # frontend/api host ports are closed. Rollback: re-add the ports: blocks and repoint serve.
  #
  # TLS: default is Tailscale-terminated — the gateway serves plain HTTP on loopback:8080 and
  # `tailscale serve` fronts it. To switch to public-domain ACME instead, set the LettuceEncrypt env
  # below (DomainNames + EmailAddress + AcceptTermsOfService=true) and uncomment the 80/443 ports.
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
      platforms: [linux/arm64]
    image: ghcr.io/lifekit-hq/finance-sentry-gateway:${IMAGE_TAG:-local}
    container_name: finance-sentry-gateway
    restart: unless-stopped
    mem_limit: 192m         # 1.3 budget: 7-day peak 89 MiB
    pids_limit: 100
    cap_drop: [ALL]         # ACME mode's 80/443 still bind: Docker allows unprivileged ports from 0 in a container
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp                # .NET diagnostics sockets
    labels:
      lifekit.contract: "v1"
      lifekit.contract.port: "8080"
      lifekit.contract.health: /gateway/health
      lifekit.contract.ready: /gateway/ready  # 200 while every YARP cluster has an available destination
      lifekit.contract.metrics: /metrics
      # `edge`: this is the box's front door (Tailscale Serve → loopback:8080 until Traefik lands;
      # the checker keeps the edge item SKIP until then, and the host port goes away with Traefik).
      lifekit.contract.ingress: edge
      lifekit.contract.service: finance-sentry-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # 8080 serves the full surface (app, API, Hangfire, MCP, health, metrics) as before;
      # 8081 is the public listener, which serves only the app and /api/** (Gateway:PublicListener).
      ASPNETCORE_URLS: http://+:8080;http://+:8081
      Gateway__PublicListener__Port: "8081"
      # Public-domain ACME (leave empty for Tailscale-terminated mode):
      LettuceEncrypt__DomainNames__0: ${GATEWAY_DOMAIN:-}
      LettuceEncrypt__EmailAddress: ${GATEWAY_ACME_EMAIL:-}
      LettuceEncrypt__AcceptTermsOfService: ${GATEWAY_ACME_ACCEPT_TOS:-false}
      # Trace spine (spec 023 amendment, 2026-09-13): OTLP/HTTP exporter, reachable over `lifekit-shared`
      # below (same network api's Loki/OTLP traffic already crosses).
      Observability__Otlp__Endpoint: ${OBSERVABILITY_OTLP_ENDPOINT:-http://otel-collector:4318}
      # Proxy to the API over finance-sentry-edge so the API sees the gateway's fixed address.
      ReverseProxy__Clusters__api__Destinations__api-1__Address: http://api-edge:5000/
      # Tailscale Serve's loopback traffic to the published port arrives from the edge bridge address;
      # only that hop may set X-Forwarded-*.
      ForwardedHeaders__KnownProxies__0: ${EDGE_BRIDGE_IP:?set EDGE_BRIDGE_IP to the edge network bridge address}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
      # Public listener, loopback only: for the edge proxy to pick up.
      - "127.0.0.1:${GATEWAY_PUBLIC_PORT:-8081}:8081"
      # ACME cutover: uncomment to publish the public TLS ports (requires GATEWAY_DOMAIN + DNS).
      # - "80:80"
      # - "443:443"
    volumes:
      - gateway_keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      api:
        condition: service_started
    networks:
      finance-sentry-edge:
        priority: 1000        # published-port traffic enters here, so its source is the edge bridge
        ipv4_address: ${EDGE_GATEWAY_IP}
      finance-sentry: {}
      lifekit-shared: {}   # reaches the OTLP collector on the shared network
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Headless Chromium for the owner's Inzhur sign-in. Inzhur has no API and guards its login with reCAPTCHA v3,
  # which only scores a real page, so the api drives the cabinet's own sign-in page here over the DevTools
  # protocol when the owner taps Connect/Reconnect and types the SMS code; the daily sync never uses it (it
  # refreshes the stored session over plain HTTPS). DevTools is unauthenticated, so the sidecar sits alone with
  # the api on the inzhur-browser network and publishes no port. Not a product: no contract probes.
  inzhur-browser:
    image: chromedp/headless-shell:155.0.8059.40
    container_name: finance-sentry-inzhur-browser
    restart: unless-stopped
    user: "65534:65534"     # nobody; Chromium runs unsandboxed (--no-sandbox in the image's run.sh) inside the container
    mem_limit: 768m         # idle 45 MiB; one sign-in page is a few hundred
    shm_size: 256m          # Chromium's renderer shared memory; the 64m default crashes tabs
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=128m      # profile, cache and crash dumps; HOME points here
    environment:
      HOME: /tmp
    labels:
      lifekit.contract: "none"   # platform piece (upstream image), not a product
    networks:
      - inzhur-browser
    healthcheck:
      # The image has no curl; a TCP connect to Chromium's own DevTools port shows the browser is up.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9223"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  postgres:
    image: postgres:14-alpine
    container_name: finance-sentry-postgres
    restart: unless-stopped
    mem_limit: 512m         # 1.3 budget: 7-day peak 287 MiB
    pids_limit: 300         # one backend process per connection: max_connections=200 plus background workers
    # The image's entrypoint starts as root to own the data and socket directories, then runs the
    # server as `postgres` (uid 70); these are the capabilities that step needs.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /var/run/postgresql # unix socket + lock file
      - /tmp
    labels:
      lifekit.contract: "none"   # datastore, not a product
    environment:
      POSTGRES_USER: ${DB_USER:-finance_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-finance_sentry}
    command: postgres -c max_connections=200 -c shared_buffers=256MB
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finance-sentry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-finance_user} -d ${DB_NAME:-finance_sentry}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # --- Observability ------------------------------------------------------------------------------
  # The loki / prometheus / grafana trio MOVED to lifekit-stack's compose project
  # on 2026-09-06 (lifekit-hq/lifekit-stack#133). It was box infrastructure living
  # in one product's compose file, on this product's private network — which is why
  # Prometheus could only ever see one target and nothing else on the box had
  # alerting at all. It now scrapes devclaw too and carries the alert rules.
  #
  # What stays this repo's job: the API's /metrics endpoint, the Loki sink below,
  # and the dashboards under observability/grafana/dashboards/ — deploy.sh
  # publishes those to the directory lifekit-stack's Grafana provisions from, so
  # each dashboard still has exactly one home, here.
  #
  # api reaches the moved Loki unchanged: it is on the `lifekit-shared` network,
  # where lifekit-stack's `loki` service name resolves.

volumes:
  postgres_data:
  api_logs:
  gateway_keys:   # data-protection key cache for the non-root gateway (025) — only used when TLS/ACME is enabled

networks:
  finance-sentry:
    name: finance-sentry
  lifekit-shared:
    external: true              # owned by lifekit-stack; must exist before deploy
  identity-oidc:
    external: true              # only Logto and its on-box OIDC clients; deploy.sh creates it idempotently
  # Gateway <-> API hop with pinned addresses: forwarded-header trust on both hosts names these
  # addresses (bridge .1 = host ingress, .2 = gateway) instead of trusting every sender. ip_range
  # keeps dynamic allocation (the API) on .4-.7 so it can never take the gateway's pinned .2.
  # api <-> inzhur-browser only. Not `internal`: the browser must reach www.inzhur.reit to load the sign-in page.
  inzhur-browser:
    name: finance-sentry-inzhur-browser
  finance-sentry-edge:
    name: finance-sentry-edge
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:?set EDGE_SUBNET to the edge network CIDR}
          ip_range: ${EDGE_IP_RANGE:?set EDGE_IP_RANGE to the dynamic-allocation range inside EDGE_SUBNET}
          gateway: ${EDGE_BRIDGE_IP}

# GitHub Packages token for @lifekit-hq/* installs (BuildKit secret — not in layers).
# Only a local frontend build reads it (the break-glass path in deploy.sh; CI builds the published
# image). Locally: export NODE_AUTH_TOKEN=$(gh auth token)  (needs read:packages scope).
secrets:
  npm_token:
    environment: NODE_AUTH_TOKEN
