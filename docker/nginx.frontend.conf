# nginx config for the Angular SPA inside finance-sentry-frontend.
# Listens on 4200 (matches the host port mapping in docker-compose.prod.yml),
# proxies /api/* to the API container, and serves index.html for any
# non-asset path so client-side routing keeps working on F5 / direct URLs.
#
# Platform contract (guardrail 1, spec 048): the container answers /healthz,
# /readyz and /metrics itself and writes one JSON object per access-log line
# to stdout, carrying the caller's traceparent. Dockerfile.frontend.prod loads
# the njs module this file's /metrics handler needs and quiets the entrypoint
# and startup notices, so stdout is JSON from the first line.

js_import metrics from /etc/nginx/njs/metrics.js;

# One JSON object per line. escape=json makes every $variable a valid JSON string
# (quotes, control characters and non-UTF-8 bytes are escaped), so a crafted
# User-Agent or URI cannot break the line. traceparent is the W3C header the
# platform probes send and the gateway propagates.
log_format contract_json escape=json
    '{"@t":"$time_iso8601",'
    '"@m":"$request_method $uri $status",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"query":"$args",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"x_forwarded_for":"$http_x_forwarded_for",'
    '"traceparent":"$http_traceparent",'
    '"upstream_status":"$upstream_status"}';

server {
    listen 4200;
    server_name _;

    access_log /dev/stdout contract_json;

    # --- Platform contract endpoints -------------------------------------------------------------
    # Liveness: the process answers. JSON on purpose — the checker rejects text/html so the SPA
    # fallback can never masquerade as a health answer.
    location = /healthz {
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    # Readiness: the built bundle is present to serve. 503 when the image was built without it.
    location = /readyz {
        default_type application/json;
        if (!-f /usr/share/nginx/html/index.html) {
            return 503 '{"status":"not_ready","reason":"index.html missing"}';
        }
        return 200 '{"status":"ready"}';
    }

    # Prometheus exposition, derived from stub_status by nginx.metrics.js.
    location = /metrics {
        access_log off;
        js_content metrics.metrics;
    }

    # Raw stub_status, subrequest-only (the /metrics handler reads it); never reachable from a client.
    location = /stub_status {
        internal;
        access_log off;
        stub_status;
    }

    # API proxy — keep /api/v1/* served from the same origin so the auth
    # cookie (SameSite=Strict) survives. The api container is reachable by
    # name on the finance-sentry bridge network.
    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # IBKR connect holds the request open while IBeam cold-starts and the
        # user approves 2FA — up to IBeam:SpawnTimeoutSeconds (300s). The nginx
        # default of 60s aborts that flow, so give it headroom past 300s.
        proxy_read_timeout 320s;
        proxy_send_timeout 320s;
    }

    # Static assets — long cache, immutable.
    location ~* \.(?:js|css|woff2?|svg|png|jpe?g|webp|ico)$ {
        root /usr/share/nginx/html;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — everything else returns index.html so Angular's router can
    # handle the path. index.html must NEVER be cached: Angular hashes all the
    # other asset filenames for cache busting, but the cache busting only works
    # if the browser actually re-fetches index.html to learn the new hashes.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # Disable caching for HTML responses (index.html + any other .html).
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires off;
    }
}
