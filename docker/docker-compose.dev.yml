services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      secrets: [npm_token]
    container_name: finance-sentry-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - finance-sentry-network
    volumes:
      - ../frontend:/app
      # Keep container-generated build artifacts OFF the host bind mount. ng serve runs as root
      # in this container, so without these anonymous volumes it writes root-owned node_modules/
      # and .angular/cache/ files back onto the host repo — which then break a host-side `ng serve`
      # (EACCES on vite dep re-optimization, unremovable without sudo).
      - /app/node_modules
      - /app/.angular

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: finance-sentry-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=finance_sentry;Username=finance_user;Password=finance_password;"
      # Read-only path for the analytics query tool (033). The app login is granted the SELECT-only
      # fs_readonly role by migration M001 and drops into it per query (SET LOCAL ROLE), so the same
      # DSN is safe here; a dedicated fs_readonly LOGIN can replace it in production for defense in depth.
      ConnectionStrings__ReadOnly: "Host=postgres;Port=5432;Database=finance_sentry;Username=finance_user;Password=finance_password;"
      TrueLayer__AuthBaseUrl: https://auth.truelayer.com
      TrueLayer__ApiBaseUrl: https://api.truelayer.com
      TrueLayer__ClientId: ${TRUELAYER_CLIENT_ID:-}
      TrueLayer__ClientSecret: ${TRUELAYER_CLIENT_SECRET:-}
      TrueLayer__FrontendRedirectBase: http://localhost:4200
      TrueLayer__CallbackPath: /api/v1/accounts/truelayer/callback
      AnalystSources__Finnhub__ApiKey: ${FINNHUB_API_KEY:-}
      # FRED yield-curve source (feature 021 market regime). Empty = rates axis silent.
      Regime__Fred__ApiKey: ${FRED_API_KEY:-}
      # In-app finance agent / browser Ledger (feature 040). Empty = agent disabled (keyless-graceful).
      Agent__Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      # Alt brain: delegate the chat to the existing OpenClaw Ledger (finance) agent — no Anthropic key
      # needed. Set BaseUrl+Token to enable (auto-selected when no Anthropic key is present).
      Agent__OpenClaw__BaseUrl: ${OPENCLAW_GATEWAY_URL:-}
      Agent__OpenClaw__Token: ${OPENCLAW_GATEWAY_TOKEN:-}
      # Off-host encrypted backups (feature 024). Empty = backup jobs no-op.
      Backup__R2Endpoint: ${BACKUP_R2_ENDPOINT:-}
      Backup__R2Bucket: ${BACKUP_R2_BUCKET:-}
      Backup__R2AccessKey: ${BACKUP_R2_ACCESS_KEY:-}
      Backup__R2SecretKey: ${BACKUP_R2_SECRET_KEY:-}
      Backup__AgeRecipient: ${BACKUP_AGE_RECIPIENT:-}
      Backup__AgeIdentity: ${BACKUP_AGE_IDENTITY:-}
      TrueLayer__Scopes: "info accounts balance transactions cards offline_access"
      Jwt__Secret: ${JWT_SECRET:-your-secret-key-change-in-production}
      Jwt__Issuer: "https://finance-sentry.local"
      Deduplication__MasterKeyBase64: dGVzdC1kZWR1cGxpY2F0aW9uLWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==
      GOOGLEOAUTH__CLIENTID: "${GOOGLE_CLIENT_ID:-}"
      # Ship structured logs to Loki (fire-and-forget); empty disables the sink.
      Observability__Loki__Url: http://loki:3100
      # Trace spine (spec 023 amendment) OTLP exporter — empty so dev boots without a collector.
      Observability__Otlp__Endpoint: ""
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finance-sentry-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./logs:/app/logs

  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
    container_name: finance-sentry-mcp
    restart: unless-stopped
    stdin_open: true
    environment:
      MCP_TRANSPORT: ${MCP_TRANSPORT:-stdio}
      MCP_HTTP_PORT: ${MCP_HTTP_PORT:-5100}
      MCP_CONNECTION_STRING: ${MCP_CONNECTION_STRING:-Host=postgres;Port=5432;Database=finance_sentry;Username=finance_user;Password=finance_password}
      ConnectionStrings__Default: ${MCP_CONNECTION_STRING:-Host=postgres;Port=5432;Database=finance_sentry;Username=finance_user;Password=finance_password}
      # Read-only path for run_analytics_query (033) — see the api service note above.
      ConnectionStrings__ReadOnly: ${MCP_READONLY_CONNECTION_STRING:-${MCP_CONNECTION_STRING:-Host=postgres;Port=5432;Database=finance_sentry;Username=finance_user;Password=finance_password}}
      Deduplication__MasterKeyBase64: dGVzdC1kZWR1cGxpY2F0aW9uLWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==
      Jwt__Secret: ${JWT_SECRET:-your-secret-key-change-in-production}
      Mcp__ApiBaseUrl: http://api:5000/api/v1
      Mcp__FrontendBaseUrl: http://localhost:4200
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finance-sentry-network

  # --- Edge gateway (025) — single YARP reverse-proxy front door ------------------------------------
  # ADDITIVE: the direct frontend (4200) and api (5001) ports above stay published, so dev can use
  # the gateway path (http://localhost:8080) OR bypass it directly (dev parity, FR-008).
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    container_name: finance-sentry-gateway
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # Trace spine (spec 023 amendment) OTLP exporter — empty so dev boots without a collector.
      Observability__Otlp__Endpoint: ""
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - finance-sentry-network

  postgres:
    image: postgres:14-alpine
    container_name: finance-sentry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_password
      POSTGRES_DB: finance_sentry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finance-sentry-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user -d finance_sentry"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Observability stack (023) -------------------------------------------------
  loki:
    image: grafana/loki:3.1.1
    container_name: finance-sentry-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - finance-sentry-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: finance-sentry-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
    networks:
      - finance-sentry-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: finance-sentry-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - finance-sentry-network

volumes:
  postgres_data:
    driver: local
  loki_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  finance-sentry-network:
    driver: bridge

# GitHub Packages token for @lifekit-hq/* installs (BuildKit secret — not in layers).
# Locally: export NODE_AUTH_TOKEN=$(gh auth token)  (needs read:packages scope).
# CI/deploy: the workflow passes secrets.GITHUB_TOKEN.
secrets:
  npm_token:
    environment: NODE_AUTH_TOKEN
