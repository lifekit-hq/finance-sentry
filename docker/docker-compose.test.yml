# Backend build + full test suite in a memory-capped SDK container:
#   docker compose -f docker/docker-compose.test.yml run --rm backend-tests
# (scripts/test-backend.sh wraps this). Build parallelism comes from backend/Directory.Build.rsp,
# so no -m flags are needed. The service stays on the compose default network, not host networking,
# so the container's 127.0.0.1 is its own loopback and a test's fake connection string cannot reach a
# service on the box. No Docker socket is passed in: container-backed tests skip themselves
# (run them on the host, or in CI, where a daemon is reachable). mem_limit matches the production host's per-build-container limit.
#
# FinanceSentry.Tests.Integration runs after the solution run, alone in the container, as two test-host
# processes: Auth namespace and the rest (#1556). Inside the solution run its test host shares the 2 GB
# with the other test projects, which `dotnet test` runs concurrently, and gets killed.
# Every WebApplicationFactory host the suite builds stays reachable until its test host exits: EF Core's
# process-wide internal service-provider cache keeps each host's DbContext, and through it the whole
# host (OpenTelemetry metric storage included), even after the factory is disposed. So the GC heap
# grows with the number of hosts one process builds. The GC heap hard limit in a container is 75% of
# mem_limit (1536 MB at 2g). Measured GC heap peak, committed after GC (2026-11-27, 10 cores, 1047 tests):
#   whole suite in one process    2089 MB  -> out of memory at 2g (would leave ~9% headroom even at 3g)
#   Auth namespace                 954 MB  (cgroup peak 736 MB)
#   everything else               1081 MB  (cgroup peak 847 MB)
# xUnit parallelism only changes how fast the heap fills (one collection at a time still reached
# 1266 MB, 2.3x slower). If a half nears 1536 MB, split it again rather than raising mem_limit.
services:
  backend-tests:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    mem_limit: 2g
    working_dir: /src/backend
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
      DOTNET_CLI_HOME: /tmp
      DOTNET_NOLOGO: "1"
      DOTNET_gcServer: "0"
      NUGET_PACKAGES: /nuget
    volumes:
      - ..:/src
      - fs-backend-tests-nuget:/nuget
    command:
      - sh
      - -c
      - >-
        dotnet restore FinanceSentry.sln &&
        dotnet build FinanceSentry.sln --no-restore -c Release &&
        dotnet test FinanceSentry.sln --no-build -c Release
        --filter 'FullyQualifiedName!~FinanceSentry.Tests.Integration.' &&
        dotnet test tests/FinanceSentry.Tests.Integration/FinanceSentry.Tests.Integration.csproj --no-build -c Release
        --filter 'FullyQualifiedName~FinanceSentry.Tests.Integration.&FullyQualifiedName!~FinanceSentry.Tests.Integration.Auth.' &&
        dotnet test tests/FinanceSentry.Tests.Integration/FinanceSentry.Tests.Integration.csproj --no-build -c Release
        --filter 'FullyQualifiedName~FinanceSentry.Tests.Integration.Auth.'

volumes:
  fs-backend-tests-nuget:
    name: fs-backend-tests-nuget
